<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的故事</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none !important;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fdf2f8 0%, #f5f3ff 50%, #f0f9ff 100%);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow-x: hidden;
            color: #5a4a52;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        #cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: cursorBeat 1.2s ease-in-out infinite;
        }

        #cursor::before,
        #cursor::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 16px;
            background: #f093b8;
            border-radius: 10px 10px 0 0;
            top: 0;
            box-shadow: 0 0 8px rgba(240, 147, 184, 0.5);
        }

        #cursor::before {
            left: 10px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        #cursor::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes cursorBeat {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        .click-heart {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            animation: clickHeartFloat 1.5s ease-out forwards;
            color: #f4b6ce;
        }

        @keyframes clickHeartFloat {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -150%) scale(1.2);
            }
        }

        .page-title {
            text-align: center;
            padding: 60px 20px 30px;
            position: relative;
            z-index: 1;
        }

        .page-title h1 {
            font-size: 2.5rem;
            color: #b86b8a;
            font-weight: 500;
            margin-bottom: 10px;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        .page-title p {
            color: #a78998;
            font-size: 1.05rem;
            opacity: 0.9;
        }

        @keyframes titleGlow {
            0% {
                text-shadow: 0 0 10px rgba(216, 152, 179, 0.25);
            }
            100% {
                text-shadow: 0 0 20px rgba(216, 152, 179, 0.45);
            }
        }

        .photo-wall {
            position: relative;
            width: 90%;
            max-width: 1100px;
            height: 860px;
            margin: 0 auto;
            z-index: 1;
        }

        .photo-item {
            position: absolute;
            background: #ffffff;
            padding: 7px 7px 28px;
            border-radius: 4px;
            box-shadow: 0 6px 18px rgba(200, 150, 175, 0.18);
            transition: all 0.4s ease;
            opacity: 0;
            animation: photoFloat 6s ease-in-out infinite;
            cursor: pointer;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 2px;
        }

        .photo-item:hover {
            transform: translate(-50%, -50%) scale(1.18) rotate(0deg) !important;
            box-shadow: 0 12px 28px rgba(220, 160, 185, 0.28);
            z-index: 20;
        }

        @keyframes photoFloat {
            0%, 100% {
                transform: translate(-50%, -50%) translateY(0) rotate(var(--rotate));
            }
            50% {
                transform: translate(-50%, -50%) translateY(-5px) rotate(var(--rotate));
            }
        }

        .photo-item.show {
            opacity: 1;
        }

        .story-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(250, 240, 245, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .story-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #fffafc;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #5a4a52;
            box-shadow: 0 15px 40px rgba(180, 130, 155, 0.2);
        }

        .story-modal.active .modal-content {
            transform: scale(1);
        }

        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 16px 16px 0 0;
        }

        .modal-body {
            padding: 25px 30px 30px;
        }

        .modal-date {
            color: #c27a96;
            font-size: 0.95rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .modal-story {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #6b5a62;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            border: none;
            color: #b86b8a;
            font-size: 20px;
            line-height: 36px;
            text-align: center;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        @media (max-width: 768px) {
            * {
                cursor: auto !important;
            }

            #cursor {
                display: none;
            }

            .page-title h1 {
                font-size: 1.8rem;
            }

            .photo-wall {
                height: 700px;
            }

            .photo-item {
                padding: 6px 6px 24px;
            }
        }
    </style>
</head>
<body>
    <div id="cursor"></div>
    <canvas id="bgCanvas"></canvas>

    <div class="page-title">
        <h1>我们的故事</h1>
        <p>点击照片，解锁专属回忆 ✨</p>
    </div>

    <div class="photo-wall" id="photoWall"></div>

    <div class="story-modal" id="storyModal">
        <button class="close-btn" id="closeBtn">×</button>
        <div class="modal-content">
            <img id="modalImg" src="" alt="照片">
            <div class="modal-body">
                <div class="modal-date" id="modalDate"></div>
                <div class="modal-story" id="modalStory"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================================================
        // 【照片配置区】
        // 数量保持 32 张不变，你只需要修改 src、date、story
        // ==================================================
        const photos = [
            { src: "photo01.jpg", date: "2024.02.14", story: "第一次一起过情人节，你说这是你收到过最丑的花，但还是开心了好久。那天的晚风很甜，你的眼睛比路灯还亮。" },
            { src: "photo02.jpg", date: "2024.03.20", story: "周末一起去海边看日出，你冻得缩在我怀里，说日出也没什么好看的，却偷偷拍了好多张我的侧脸。" },
            { src: "photo03.jpg", date: "2024.05.01", story: "一起去爬泰山，你半路累到走不动，嘴上说着再也不爬山了，还是咬牙坚持到了山顶。" },
            { src: "photo04.jpg", date: "2024.06.18", story: "你生日那天，我偷偷准备了你念叨了很久的礼物，你拆礼物的时候眼睛红红的。" },
            { src: "photo05.jpg", date: "2024.08.09", story: "七夕节，我们在家煮了火锅，你说不用什么隆重的仪式，只要和我在一起，每天都是节日。" },
            { src: "photo06.jpg", date: "2024.10.07", story: "国庆一起回了老家，你陪我奶奶聊了一下午的天，奶奶偷偷跟我说，这个姑娘真好。" },
            { src: "photo07.jpg", date: "2024.12.25", story: "圣诞节的初雪，我们在楼下踩雪，你把冻僵的手塞进我脖子里，笑得像个傻子。" },
            { src: "photo08.jpg", date: "2025.01.01", story: "跨年的烟花下，你说新的一年还要在一起，我说不止今年，往后每一年都要和你一起。" },
            { src: "photo09.jpg", date: "2025.02.20", story: "一起养的小猫第一次学会握手，你激动得录了十几个视频，说我们也是一家三口了。" },
            { src: "photo10.jpg", date: "2025.04.05", story: "春天一起去野餐，你准备了一篮子好吃的，结果大部分都进了我的肚子。" },
            { src: "photo11.jpg", date: "2025.06.01", story: "儿童节给你买了棒棒糖和旺仔牛奶，你说在我身边永远可以当小朋友。" },
            { src: "photo12.jpg", date: "2025.08.07", story: "在一起两周年，我们去拍了纪念照，你说时间过得好快，好像昨天才刚认识我。" },

            { src: "photo13.jpg", date: "2024.01.01", story: "那天我们第一次牵手，你手心有点出汗，我假装很镇定，其实心跳已经快到听得到。" },
            { src: "photo14.jpg", date: "2024.04.15", story: "一起去看演唱会，你在人群里跟着唱，我在旁边看你，觉得全世界都安静了。" },
            { src: "photo15.jpg", date: "2024.07.22", story: "夏天的傍晚，我们一起散步买冰棒，你把最甜的那一口留给了我。" },
            { src: "photo16.jpg", date: "2024.09.10", story: "你说这一天很普通，但因为一起吃了晚饭，所以变得特别。" },
            { src: "photo17.jpg", date: "2024.11.11", story: "我们没有买买买，只是坐在窗边喝热饮，你说这样也很好。" },
            { src: "photo18.jpg", date: "2024.12.31", story: "跨年夜倒数的时候，我偷偷许愿：以后的每一年都要和你一起。" },
            { src: "photo19.jpg", date: "2025.02.14", story: "第二个情人节，我们比以前更懂彼此了，连沉默都觉得很安心。" },
            { src: "photo20.jpg", date: "2025.03.08", story: "那天给你拍了好多照片，你说自己不好看，可我觉得每一张都很喜欢。" },
            { src: "photo21.jpg", date: "2025.05.20", story: "520这天没有说很复杂的话，只是想告诉你：我真的很庆幸遇见你。" },
            { src: "photo22.jpg", date: "2025.07.07", story: "我们一起躲雨，你把伞偏向我这边，自己肩膀湿了一大片。" },
            { src: "photo23.jpg", date: "2025.09.09", story: "你加班到很晚，我去接你，你看到我时眼睛亮得像星星。" },
            { src: "photo24.jpg", date: "2025.11.02", story: "一起整理房间，你把照片摆成一排，说这样看着就很幸福。" },

            { src: "photo25.jpg", date: "2023.12.24", story: "平安夜我们第一次正式约会，你穿了浅色外套，干净得像冬天里的阳光。" },
            { src: "photo26.jpg", date: "2024.02.22", story: "一起去逛花店，你捧着一束小花站在路边，我突然想把所有温柔都给你。" },
            { src: "photo27.jpg", date: "2024.06.01", story: "你像小朋友一样要吃糖，我像答应小朋友一样答应你：以后都给你买。" },
            { src: "photo28.jpg", date: "2024.08.15", story: "那天我们坐在江边吹晚风，你说未来很远，但你愿意和我一起走。" },
            { src: "photo29.jpg", date: "2024.10.20", story: "一起做了一顿很咸的饭，最后笑着吃完了，因为是和你一起做的。" },
            { src: "photo30.jpg", date: "2025.01.20", story: "下雪天我们一起踩脚印，你说要把快乐也踩进雪里。" },
            { src: "photo31.jpg", date: "2025.04.20", story: "春天花开的时候，你站在花下面拍照，我心里悄悄说：你比花还好看。" },
            { src: "photo32.jpg", date: "2025.08.08", story: "今天只是普通的一天，但因为有你，所以值得被放进这颗心里。" }
        ];
        // ==================================================
        //  照片配置结束
        // ==================================================


        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('click', (e) => {
            for (let i = 0; i < 5; i++) {
                const heart = document.createElement('div');
                heart.className = 'click-heart';
                heart.innerHTML = '🤍';
                heart.style.left = e.clientX + (Math.random() - 0.5) * 60 + 'px';
                heart.style.top = e.clientY + (Math.random() - 0.5) * 30 + 'px';
                heart.style.fontSize = (12 + Math.random() * 12) + 'px';
                heart.style.animationDelay = (i * 0.1) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1500);
            }
        });

        const photoWall = document.getElementById('photoWall');

        function heartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * scale, y: y * scale };
        }

        function generateHeartFillPoints(count, width, height) {
            const points = [];
            const centerX = width / 2;
            const centerY = height / 2 - 30;

            const layers = [
                { scale: 18, count: 20 },
                { scale: 13, count: 8 },
                { scale: 7,  count: 4 }
            ];

            let totalGenerated = 0;

            layers.forEach(layer => {
                for (let i = 0; i < layer.count && totalGenerated < count; i++) {
                    const t = (i / layer.count) * Math.PI * 2 + Math.random() * 0.3;
                    const p = heartPoint(t, layer.scale);

                    const offsetX = (Math.random() - 0.5) * 45;
                    const offsetY = (Math.random() - 0.5) * 45;

                    points.push({
                        x: centerX + p.x + offsetX,
                        y: centerY + p.y + offsetY
                    });

                    totalGenerated++;
                }
            });

            while (totalGenerated < count) {
                const t = Math.random() * Math.PI * 2;
                const p = heartPoint(t, 18);

                const offsetX = (Math.random() - 0.5) * 50;
                const offsetY = (Math.random() - 0.5) * 50;

                points.push({
                    x: centerX + p.x + offsetX,
                    y: centerY + p.y + offsetY
                });

                totalGenerated++;
            }

            return points;
        }

        function renderPhotos() {
            const wallRect = photoWall.getBoundingClientRect();
            const points = generateHeartFillPoints(photos.length, wallRect.width, wallRect.height);

            photos.forEach((photo, index) => {
                const item = document.createElement('div');
                item.className = 'photo-item';

                const size = 68 + Math.random() * 24;
                const rotate = (Math.random() - 0.5) * 16;

                item.style.width = size + 'px';
                item.style.height = size * 1.2 + 'px';
                item.style.left = points[index].x + 'px';
                item.style.top = points[index].y + 'px';
                item.style.setProperty('--rotate', rotate + 'deg');
                item.style.transform = `translate(-50%, -50%) rotate(${rotate}deg)`;
                item.style.animationDelay = (index * 0.08) + 's';

                item.innerHTML = `<img src="${photo.src}" alt="照片${index + 1}" loading="lazy">`;

                item.addEventListener('click', () => {
                    openModal(photo);
                });

                photoWall.appendChild(item);

                setTimeout(() => {
                    item.classList.add('show');
                }, 300 + index * 100);
            });
        }

        const modal = document.getElementById('storyModal');
        const modalImg = document.getElementById('modalImg');
        const modalDate = document.getElementById('modalDate');
        const modalStory = document.getElementById('modalStory');
        const closeBtn = document.getElementById('closeBtn');

        function openModal(photo) {
            modalImg.src = photo.src;
            modalDate.textContent = photo.date;
            modalStory.textContent = photo.story;
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let hearts = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class BgHeart {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = 4 + Math.random() * 10;
                this.speed = 0.5 + Math.random() * 1.5;
                this.opacity = 0.15 + Math.random() * 0.25;
                this.swayOffset = Math.random() * Math.PI * 2;
            }

            update() {
                this.y += this.speed;
                this.x += Math.sin(this.y * 0.01 + this.swayOffset) * 0.5;

                if (this.y > canvas.height + 20) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#f0b8cd';
                ctx.beginPath();

                const x = this.x;
                const y = this.y;
                const s = this.size;

                ctx.moveTo(x, y + s * 0.25);
                ctx.bezierCurveTo(x, y, x - s / 2, y, x - s / 2, y + s * 0.25);
                ctx.bezierCurveTo(x - s / 2, y + s * 0.5, x, y + s * 0.75, x, y + s);
                ctx.bezierCurveTo(x, y + s * 0.75, x + s / 2, y + s * 0.5, x + s / 2, y + s * 0.25);
                ctx.bezierCurveTo(x + s / 2, y, x, y, x, y + s * 0.25);
                ctx.fill();

                ctx.restore();
            }
        }

        function initBgHearts() {
            hearts = [];
            const count = Math.floor(canvas.width / 30);

            for (let i = 0; i < count; i++) {
                hearts.push(new BgHeart());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            hearts.forEach(h => {
                h.update();
                h.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('load', () => {
            renderPhotos();
            initBgHearts();
            animate();
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                photoWall.innerHTML = '';
                renderPhotos();
                initBgHearts();
            }, 300);
        });
    </script>
</body>
</html>
