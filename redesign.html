<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- HTML 连接 Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我们的故事</title>
    <style>

      :root {
        --paper: #f3eee7;
        --paper-deep: #e8dfd4;
        --ink: #272321;
        --muted: #746b64;
        --faint: #9a9087;
        --accent: #9c5365;
        --accent-soft: #d8a6b0;
        --line: rgba(72, 61, 55, 0.16);
        --line-strong: rgba(72, 61, 55, 0.28);
        --wood: #a8764d;
        --white: #fffdf9;
        --shadow: 0 22px 55px rgba(62, 48, 42, 0.13);
        --shadow-soft: 0 10px 30px rgba(62, 48, 42, 0.09);
        --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        cursor: none !important;
      }

      html {
        scroll-behavior: smooth;
        background: var(--paper);
      }

      body {
        min-height: 100dvh;
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 10%, rgba(255,255,255,.78), transparent 28%),
          radial-gradient(circle at 88% 72%, rgba(255,255,255,.52), transparent 25%),
          linear-gradient(180deg, #f7f3ed 0%, var(--paper) 48%, #eee7de 100%);
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: .42;
        background-image:
          radial-gradient(rgba(52,43,38,.10) .6px, transparent .6px),
          radial-gradient(rgba(255,255,255,.55) .7px, transparent .7px);
        background-position: 0 0, 4px 5px;
        background-size: 9px 9px, 13px 13px;
        mix-blend-mode: multiply;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          linear-gradient(90deg, rgba(76,59,51,.025), transparent 16%, transparent 84%, rgba(76,59,51,.025)),
          linear-gradient(180deg, rgba(76,59,51,.035), transparent 20%, transparent 80%, rgba(76,59,51,.04));
      }

      ::selection {
        background: rgba(156, 83, 101, .18);
        color: var(--ink);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      #bgCanvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: .42;
      }

      /* ---------- custom cursor ---------- */

      #cursor {
        position: fixed;
        width: 13px;
        height: 13px;
        z-index: 10000;
        pointer-events: none;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(156,83,101,.78);
        border-radius: 50%;
        transition:
          width .25s var(--ease),
          height .25s var(--ease),
          background .25s ease,
          border-color .25s ease;
      }

      #cursor::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 3px;
        height: 3px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: var(--accent);
      }

      body.cursor-hover #cursor {
        width: 34px;
        height: 34px;
        background: rgba(255,253,249,.22);
        border-color: rgba(156,83,101,.55);
      }

      .click-heart {
        position: fixed;
        pointer-events: none;
        z-index: 9998;
        color: var(--accent);
        font-size: 12px;
        animation: clickHeartFloat 1.15s var(--ease) forwards;
      }

      @keyframes clickHeartFloat {
        0% { opacity: .9; transform: translate(-50%, -50%) scale(.65); }
        100% { opacity: 0; transform: translate(-50%, -145%) scale(1.05); }
      }

      /* ---------- top editorial header ---------- */

      .page-title {
        position: relative;
        z-index: 2;
        width: min(1320px, calc(100% - 64px));
        margin: 0 auto;
        padding: 54px 0 18px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: end;
        column-gap: 28px;
      }

      .page-title::before {
        content: "MEMORY ARCHIVE";
        grid-column: 1;
        justify-self: start;
        align-self: center;
        color: var(--faint);
        font-size: 10px;
        letter-spacing: .26em;
        font-weight: 600;
      }

      .page-title::after {
        content: "18 MOMENTS  /  2025 — 2026";
        grid-column: 3;
        justify-self: end;
        align-self: center;
        color: var(--faint);
        font-size: 10px;
        letter-spacing: .16em;
        font-variant-numeric: tabular-nums;
      }

      .story-title-img {
        grid-column: 2;
        width: clamp(240px, 28vw, 390px);
        height: auto;
        display: block;
        filter: saturate(.82) contrast(.98);
      }

      .continue-text {
        position: fixed;
        right: 26px;
        bottom: 24px;
        z-index: 20;
        width: 168px;
        pointer-events: none;
        opacity: .72;
        mix-blend-mode: multiply;
        animation: continueFloat 4.5s ease-in-out infinite;
      }

      .continue-text img {
        width: 100%;
        height: auto;
        display: block;
      }

      @keyframes continueFloat {
        0%,100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-5px) rotate(1deg); }
      }

      /* ---------- hanging photo archive ---------- */

      .photo-wall {
        position: relative;
        z-index: 1;
        width: min(1320px, calc(100% - 64px));
        min-height: 820px;
        margin: 0 auto 36px;
        isolation: isolate;
      }

      .photo-wall::before {
        content: "";
        position: absolute;
        inset: 12px 0 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid rgba(72,61,55,.08);
        pointer-events: none;
      }

      .rope-set {
        position: absolute;
        left: 2%;
        right: 2%;
        z-index: 1;
      }

      .rope-set.top { top: 38px; }
      .rope-set.middle { top: 274px; }
      .rope-set.bottom { top: 518px; }

      .rope-canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 70px;
        pointer-events: none;
        z-index: 2;
      }

      .rope-anchor {
        position: absolute;
        top: 0;
        width: 25px;
        height: 25px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 30%, rgba(255,255,255,.42), transparent 28%),
          linear-gradient(145deg, #c79a6d, #94633f);
        border: 1px solid rgba(75,45,27,.25);
        box-shadow:
          inset 0 1px 2px rgba(255,255,255,.45),
          0 5px 12px rgba(66,44,30,.15);
        z-index: 4;
      }

      .rope-anchor.left { left: -12px; }
      .rope-anchor.right { right: -12px; }

      .rope-anchor::before {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: rgba(57,39,27,.36);
      }

      .photo-item {
        position: absolute;
        background: var(--white);
        padding: 7px 7px 18px;
        border-radius: 2px;
        box-shadow:
          0 18px 35px rgba(53,42,36,.13),
          0 3px 8px rgba(53,42,36,.08);
        transition:
          transform .5s var(--ease),
          box-shadow .35s ease,
          filter .35s ease;
        opacity: 0;
        animation: photoFloat 7.5s ease-in-out infinite;
        cursor: pointer;
        z-index: 5;
        will-change: transform;
      }

      .photo-item::after {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 6px;
        height: 1px;
        background: rgba(60,45,38,.08);
      }

      .photo-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 1px;
        filter: saturate(.88) contrast(.98);
        transition: filter .5s ease;
      }

      .photo-item:hover {
        transform: translate(-50%, -50%) translateY(-9px) scale(1.08) rotate(0deg) !important;
        box-shadow:
          0 28px 50px rgba(53,42,36,.22),
          0 6px 14px rgba(53,42,36,.12);
        z-index: 20;
      }

      .photo-item:hover img {
        filter: saturate(1) contrast(1);
      }

      .photo-item.show {
        opacity: 1;
      }

      @keyframes photoFloat {
        0%,100% {
          transform: translate(-50%, -50%) translateX(0) translateY(0) rotate(var(--rotate));
        }
        50% {
          transform: translate(-50%, -50%) translateX(var(--swing)) translateY(-6px)
            rotate(calc(var(--rotate) + 1.6deg));
        }
      }

      .wood-clip {
        position: absolute;
        top: -7px;
        left: 50%;
        transform: translateX(-50%);
        width: 38px;
        height: 13px;
        background: linear-gradient(180deg, #d3aa7d, #9b6b44);
        border-radius: 2px;
        border: 1px solid rgba(82,54,34,.18);
        z-index: 6;
        box-shadow: 0 2px 5px rgba(56,39,28,.18);
      }

      .wood-clip::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 4px;
        height: 8px;
        transform: translate(-50%, -50%);
        background: #62564f;
        border-radius: 1px;
      }

      /* The original decorative emoji elements are intentionally restrained. */
      .cute-element {
        position: absolute;
        pointer-events: none;
        z-index: 0;
        opacity: .28;
        filter: grayscale(.2);
        font-size: 20px !important;
        animation: floatElement 10s ease-in-out infinite;
      }

      .cute-element.animal,
      .cute-element.tree {
        font-size: 26px !important;
        opacity: .2;
      }

      .cute-element.heart,
      .cute-element.sparkle,
      .cute-element.star {
        opacity: .26;
      }

      @keyframes floatElement {
        0%,100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
      }

      /* ---------- story modal ---------- */

      .story-modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 28px;
        background: rgba(39,35,33,.46);
        backdrop-filter: blur(14px) saturate(.75);
        -webkit-backdrop-filter: blur(14px) saturate(.75);
        opacity: 0;
        visibility: hidden;
        transition: opacity .35s ease, visibility .35s ease;
      }

      .story-modal.active {
        opacity: 1;
        visibility: visible;
      }

      .modal-content {
        position: relative;
        width: min(980px, 100%);
        max-height: min(88dvh, 900px);
        overflow: auto;
        display: grid;
        grid-template-columns: minmax(0, 1.12fr) minmax(280px, .88fr);
        background: #f8f4ee;
        border: 1px solid rgba(255,255,255,.55);
        box-shadow: 0 36px 90px rgba(26,20,18,.30);
        transform: translateY(18px) scale(.985);
        transition: transform .5s var(--ease);
      }

      .story-modal.active .modal-content {
        transform: translateY(0) scale(1);
      }

      .modal-content img {
        width: 100%;
        height: 100%;
        min-height: 480px;
        object-fit: cover;
        border-radius: 0;
      }

      .modal-body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(30px, 4vw, 56px);
        border-left: 1px solid var(--line);
      }

      .modal-date {
        margin-bottom: 22px;
        color: var(--accent);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .22em;
        font-variant-numeric: tabular-nums;
      }

      .modal-date::before {
        content: "MOMENT  /  ";
        color: var(--faint);
      }

      .modal-story {
        max-width: 36em;
        color: #4d4540;
        font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
        font-size: 16px;
        line-height: 2.05;
        text-align: left;
        white-space: pre-line;
        text-wrap: pretty;
      }

      .close-btn {
        position: fixed;
        top: 22px;
        right: 26px;
        width: 44px;
        height: 44px;
        z-index: 1010;
        border: 1px solid rgba(255,255,255,.55);
        border-radius: 50%;
        background: rgba(248,244,238,.86);
        color: var(--ink);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        transition: transform .25s ease, background .25s ease;
      }

      .close-btn:hover {
        transform: rotate(90deg);
        background: #fffdf9;
      }

      /* ---------- music player ---------- */

      .music-player {
        position: fixed;
        top: 22px;
        right: 24px;
        z-index: 1100;
        display: flex;
        align-items: center;
        gap: 13px;
        min-width: 220px;
        padding: 10px 12px 10px 16px;
        background: rgba(250,247,241,.78);
        border: 1px solid rgba(72,61,55,.12);
        border-radius: 999px;
        box-shadow: var(--shadow-soft);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .music-info {
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
      }

      .song-name {
        max-width: 165px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink);
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-size: 12px;
        font-weight: 600;
      }

      .lyric-line {
        width: 165px;
        overflow: hidden;
        white-space: nowrap;
        text-align: right;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: .05em;
        opacity: 1;
        transition: opacity .4s ease;
      }

      .lyric-line .lyric-content {
        display: inline-block;
      }

      .lyric-line.scrolling .lyric-content {
        animation: lyricScroll 8s linear forwards;
      }

      @keyframes lyricScroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }

      .music-icon {
        flex: 0 0 38px;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(156,83,101,.26);
        border-radius: 50%;
        background: rgba(255,255,255,.72);
        color: var(--accent);
        font-size: 16px;
        cursor: pointer;
        transition: transform .25s ease, background .25s ease, border-color .25s ease;
      }

      .music-icon:hover {
        background: #fffdf9;
        border-color: rgba(156,83,101,.5);
        transform: scale(1.06);
      }

      /* ---------- message board ---------- */

      .message-board {
        position: relative;
        z-index: 2;
        width: min(980px, calc(100% - 64px));
        margin: 74px auto 150px;
        padding-top: 80px;
        border-top: 1px solid var(--line);
        clear: both;
      }

      .message-header {
        position: relative;
        margin-bottom: 42px;
        text-align: left;
      }

      .message-deco {
        margin-bottom: 15px;
        color: var(--accent);
        font-size: 12px;
        letter-spacing: .35em;
      }

      .message-header h2 {
        max-width: 720px;
        color: var(--ink);
        font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
        font-size: clamp(30px, 4vw, 52px);
        font-weight: 500;
        line-height: 1.18;
        letter-spacing: -.045em;
        text-wrap: balance;
      }

      .message-header p {
        margin-top: 17px;
        max-width: 34em;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.9;
        letter-spacing: .02em;
        text-wrap: pretty;
      }

      .message-form {
        width: min(650px, 100%);
        margin-left: auto;
        padding: 28px;
        background: rgba(255,253,249,.56);
        border: 1px solid var(--line);
        box-shadow: var(--shadow-soft);
      }

      .input-wrap,
      .textarea-wrap {
        position: relative;
      }

      .input-wrap {
        margin-bottom: 12px;
      }

      .input-icon,
      .textarea-icon {
        position: absolute;
        left: 16px;
        top: 14px;
        z-index: 1;
        color: var(--accent);
        font-size: 14px;
        pointer-events: none;
      }

      .textarea-icon {
        top: 16px;
      }

      #commentName,
      #commentMessage {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 0;
        background: rgba(255,255,255,.52);
        color: var(--ink);
        outline: none;
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        transition:
          border-color .25s ease,
          background .25s ease,
          box-shadow .25s ease;
      }

      #commentName {
        height: 50px;
        padding: 0 18px 0 43px;
        font-size: 14px;
      }

      #commentMessage {
        min-height: 150px;
        padding: 15px 18px 15px 43px;
        font-size: 14px;
        line-height: 1.85;
        resize: vertical;
      }

      #commentName::placeholder,
      #commentMessage::placeholder {
        color: #aaa098;
      }

      #commentName:hover,
      #commentMessage:hover {
        border-color: rgba(72,61,55,.38);
      }

      #commentName:focus,
      #commentMessage:focus {
        border-color: var(--accent);
        background: rgba(255,255,255,.86);
        box-shadow: 0 0 0 4px rgba(156,83,101,.08);
      }

      .message-submit {
        position: relative;
        margin-top: 18px;
        min-width: 190px;
        padding: 13px 22px;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: var(--ink);
        color: #fffaf4;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: .15em;
        cursor: pointer;
        transition: transform .25s var(--ease), background .25s ease, color .25s ease;
      }

      .message-submit:hover {
        background: var(--accent);
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      .message-submit:active {
        transform: translateY(1px) scale(.985);
      }

      .message-submit[disabled] {
        opacity: .55;
        pointer-events: none;
      }

      .submit-heart {
        display: inline-block;
        margin-left: 8px;
        font-size: 14px;
        transition: transform .25s var(--ease);
      }

      .message-submit:hover .submit-heart {
        transform: translateX(3px);
      }

      .comments-title {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 78px 0 28px;
        color: var(--muted);
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-size: 17px;
        letter-spacing: .08em;
      }

      .comments-title span:first-child,
      .comments-title span:last-child {
        color: var(--accent);
        font-size: 11px;
      }

      #commentsList {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        text-align: left;
        align-items: start;
      }

      .comment-item {
        position: relative;
        min-height: 230px;
        padding: 30px 28px 22px;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: 0;
        background: rgba(255,253,249,.64);
        box-shadow: 0 10px 28px rgba(62,48,42,.06);
        transition:
          transform .35s var(--ease),
          box-shadow .35s ease,
          border-color .35s ease;
      }

      .comment-item::before {
        content: "NOTE";
        position: absolute;
        top: 13px;
        right: 16px;
        color: rgba(116,107,100,.48);
        font-size: 8px;
        font-weight: 700;
        letter-spacing: .18em;
      }

      .comment-item:hover {
        transform: translateY(-5px);
        border-color: rgba(156,83,101,.22);
        box-shadow: 0 20px 42px rgba(62,48,42,.11);
      }

      .comment-name {
        margin-bottom: 12px;
        padding-right: 45px;
        color: var(--ink);
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-size: 15px;
        font-weight: 600;
      }

      .comment-message {
        margin: 2px 0 8px;
        color: #5f5751;
        font-size: 13px;
        line-height: 1.95;
        white-space: pre-line;
        word-break: break-word;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 6;
        overflow: hidden;
        text-wrap: pretty;
      }

      .comment-more {
        display: none;
        align-self: flex-start;
        margin-top: 5px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--accent);
        font-size: 11px;
        cursor: pointer;
        letter-spacing: .08em;
        transition: transform .2s ease, color .2s ease;
      }

      .comment-more:hover {
        color: var(--ink);
        transform: translateX(3px);
      }

      .comment-message.expanded {
        display: block;
        -webkit-line-clamp: unset;
        overflow: visible;
      }

      .comment-time {
        margin-top: auto;
        padding-top: 14px;
        border-top: 1px solid rgba(72,61,55,.10);
        color: var(--faint);
        font-size: 9px;
        text-align: right;
        letter-spacing: .12em;
        font-variant-numeric: tabular-nums;
      }

      .empty-comments {
        grid-column: 1 / -1;
        padding: 48px 20px;
        text-align: center;
        color: var(--muted);
        background: rgba(255,253,249,.5);
        border: 1px dashed var(--line-strong);
      }

      .empty-heart {
        margin-bottom: 10px;
        color: var(--accent);
        font-size: 24px;
        animation: submitHeartBeat 1.8s ease-in-out infinite;
      }

      .empty-comments small {
        display: block;
        margin-top: 7px;
        color: var(--faint);
        font-size: 11px;
      }

      @keyframes submitHeartBeat {
        0%,100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }

      /* ---------- toast / inline feedback ---------- */

      .toast {
        position: fixed;
        left: 50%;
        bottom: 30px;
        z-index: 12000;
        max-width: min(90vw, 440px);
        padding: 12px 18px;

        const messageInput = document.getElementById("commentMessage");
        const submitButton = document.getElementById("submitComment");

        const name = nameInput.value.trim();
        const message = messageInput.value.trim();

        if (!name) {
          showToast("请先留下你的名字");
          nameInput.focus();
          return;
        }

        if (!message) {
          showToast("还没有写下想说的话");
          messageInput.focus();
          return;

        submitButton.disabled = true;
        submitButton.querySelector("span:first-child").textContent = "正在留下…";

          {
            name: name,
            message: message,
          },
        ]);

        submitButton.disabled = false;
        submitButton.querySelector("span:first-child").textContent = "留下这份心意";

        if (error) {
          console.error("留言提交失败：", error);
          showToast("留言没有成功提交，请稍后再试");

      function drawTwistedRope(canvas) {
        const ctx = canvas.getContext("2d");
        const rect = canvas.getBoundingClientRect();
        const width = Math.floor(rect.width);
        const height = 70;

        // 保护：宽度为0直接返回，不绘制
        if (width <= 10) return null;

        canvas.width = width;
        canvas.height = height;
        ctx.clearRect(0, 0, width, height);

        const startX = 16;
        const endX = width - 16;
        const startY = 16;
        const endY = 16;

        const midY = 38 + Math.random() * 10;
        const shadowOffsetY = 3;

        ctx.beginPath();
        ctx.moveTo(startX, startY + shadowOffsetY);
        ctx.quadraticCurveTo(
          width / 2,
          midY + shadowOffsetY + 8,
          endX,
          endY + shadowOffsetY,
        );
        ctx.strokeStyle = "rgba(60, 35, 15, 0.2)";
        ctx.lineWidth = 7;
        ctx.lineCap = "round";
        ctx.filter = "blur(2px)";
        ctx.stroke();
        ctx.filter = "none";

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(width / 2, midY + 4, endX, endY);
        ctx.strokeStyle = "rgba(90, 60, 30, 0.15)";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(width / 2, midY, endX, endY);
        ctx.strokeStyle = "#c98f5a";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(startX, startY - 1);
        ctx.quadraticCurveTo(width / 2, midY - 1.5, endX, endY - 1);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        for (let i = 0; i < 12; i++) {
          const t = i / 11;
          const x = startX + (endX - startX) * t;
          const y =
            (1 - t) * (1 - t) * startY + 2 * t * (1 - t) * midY + t * t * endY;

          ctx.fillStyle = "rgba(180, 130, 90, 0.45)";
          ctx.beginPath();
          ctx.arc(x, y, 1.8, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "rgba(130, 90, 60, 0.35)";
          ctx.beginPath();
          ctx.arc(x + 2, y + 2, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }

        return { startX, endX, startY, endY, controlY: midY };
      }

          ctx.lineWidth = 1.2;

            ctx.moveTo(0, -this.size * 1.2);
            ctx.lineTo(this.size * 0.5, -this.size * 1.7);

            ctx.stroke();
          }

          ctx.restore();
        }

              isPlaying = true;
              userStartedMusic = true;
              musicIcon.setAttribute("aria-pressed", "true");
              startIconRotate();
            })
            .catch((err) => {
              console.log("播放失败", err);
            });
        }
      });

      // 4秒一圈，每帧旋转角度
      const rotateStep = 1.44;

      function startIconRotate() {
        stopIconRotate();
        function tick() {
          iconRotateDeg += rotateStep;
          musicIcon.style.transform = `rotate(${iconRotateDeg}deg)`;
          rotateAnimId = requestAnimationFrame(tick);
        }
        tick();
      }

      function stopIconRotate() {
        if (rotateAnimId) {
          cancelAnimationFrame(rotateAnimId);
          rotateAnimId = null;
        }
      }

      musicIcon.addEventListener("click", (e) => {
        e.stopPropagation();

        if (isPlaying) {
          bgmAudio.pause();
          stopIconRotate();
          isPlaying = false;
          musicIcon.setAttribute("aria-pressed", "false");
        } else {
          bgmAudio.play().catch((err) => {
            console.log("播放失败，请检查音乐文件路径", err);
            lyricLine.textContent = "播放失败，请检查音乐文件";
          });

          startIconRotate();
          isPlaying = true;
          userStartedMusic = true;
          musicIcon.setAttribute("aria-pressed", "true");
        }
      });

      let currentLyricIndex = -1;
      let isLyricSwitching = false;

      function switchLyric(index) {
        if (isLyricSwitching || index === currentLyricIndex) return;

        isLyricSwitching = true;
        currentLyricIndex = index;
        const text = musicConfig.lyrics[index].text;

        lyricLine.style.opacity = "0";

        setTimeout(() => {
          lyricLine.innerHTML = `<span class="lyric-content">${text}</span>`;
          const contentEl = lyricLine.querySelector(".lyric-content");
          const containerWidth = lyricLine.clientWidth;

          if (contentEl.scrollWidth > containerWidth) {
            lyricLine.innerHTML = `<span class="lyric-content">${text}</span>`;

            lyricLine.classList.add("scrolling");
          } else {
            lyricLine.classList.remove("scrolling");
          }

          requestAnimationFrame(() => {
            lyricLine.style.opacity = "1";
          });

          setTimeout(() => {
            isLyricSwitching = false;
          }, 400);
        }, 400);
      }

      bgmAudio.addEventListener("timeupdate", () => {
        const currentTime = bgmAudio.currentTime;
        let targetIndex = 0;

        for (let i = musicConfig.lyrics.length - 1; i >= 0; i--) {
          if (currentTime >= musicConfig.lyrics[i].time) {
            targetIndex = i;
            break;
          }
        }

        switchLyric(targetIndex);
      });

      bgmAudio.addEventListener("error", () => {
        lyricLine.textContent = "音乐文件加载失败";
      });

      const PASSWORD = "000";

      const overlay = document.getElementById("passwordOverlay");

      const input = document.getElementById("passwordInput");

      const btn = document.getElementById("unlockBtn");

      const error = document.getElementById("errorMsg");

      btn.onclick = function () {
        if (input.value === PASSWORD) {
          overlay.style.opacity = "0";

          setTimeout(() => {
            overlay.style.display = "none";
            showToast("欢迎回来");
          }, 600);
        } else {
          error.style.display = "block";

          input.value = "";
        }
      };

      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          btn.click();
        }
      });
    </script>
  </body>
</html>
