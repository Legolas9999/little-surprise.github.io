<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的故事</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none !important;
        }

        body {
            min-height: 100vh;
            background: 
                radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.7) 0, transparent 26%),
                radial-gradient(circle at 82% 75%, rgba(255, 255, 255, 0.6) 0, transparent 22%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.35) 0, transparent 35%),
                repeating-radial-gradient(circle at center, rgba(220, 230, 245, 0.2) 0, rgba(220, 230, 245, 0.2) 2px, transparent 2px, transparent 22px),
                linear-gradient(135deg, #f5f7fa 0%, #eaf0f9 50%, #f3f0fa 100%);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow-x: hidden;
            color: #5a4a52;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.85) 0 8%, transparent 9%),
                radial-gradient(circle at 88% 12%, rgba(255, 255, 255, 0.75) 0 10%, transparent 11%),
                radial-gradient(circle at 15% 85%, rgba(255, 255, 255, 0.65) 0 7%, transparent 8%),
                radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.7) 0 9%, transparent 10%),
                linear-gradient(90deg, rgba(200, 215, 235, 0.15) 1px, transparent 1px),
                linear-gradient(rgba(200, 215, 235, 0.15) 1px, transparent 1px);
            background-size:
                100% 100%,
                100% 100%,
                100% 100%,
                100% 100%,
                50px 50px,
                50px 50px;
            background-position: center center;
            opacity: 0.6;
        }

        .continue-text {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 1;
            font-size: 1rem;
            color: #9a7ba3;
            letter-spacing: 2px;
            opacity: 0.85;
            font-style: italic;
            pointer-events: none;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        #cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: cursorBeat 1.2s ease-in-out infinite;
        }

        #cursor::before,
        #cursor::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 16px;
            background: #f093b8;
            border-radius: 10px 10px 0 0;
            top: 0;
            box-shadow: 0 0 8px rgba(240, 147, 184, 0.5);
        }

        #cursor::before {
            left: 10px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        #cursor::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes cursorBeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        .click-heart {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            animation: clickHeartFloat 1.5s ease-out forwards;
            color: #f28eb8;
        }

        @keyframes clickHeartFloat {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1.2); }
        }

        .page-title {
            text-align: center;
            padding: 16px 20px 0;
            position: relative;
            z-index: 1;
        }

        .subtitle {

    margin-top: 18px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:15px;

    font-family:
    "KaiTi",
    "STKaiti",
    serif;

    font-size:20px;

    letter-spacing:3px;

    color:#ffffff;

    text-shadow:
    0 2px 8px rgba(0,0,0,0.25);

}




        .story-title-img {
    width: 420px;
    height: auto;
    display: block;
    margin: 0 auto;
}

        .page-title h1 {
            font-size: 2.5rem;
            color: #a87a9a;
            font-weight: 500;
            margin-bottom: 6px;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        .page-title p {
            color: #8f8aa0;
            font-size: 1.05rem;
            opacity: 0.9;
        }

        @keyframes titleGlow {
            0% { text-shadow: 0 0 10px rgba(180, 150, 190, 0.25); }
            100% { text-shadow: 0 0 20px rgba(180, 150, 190, 0.45); }
        }

        .photo-wall {
            position: relative;
            width: 92%;
            max-width: 1200px;
            min-height: 780px;
            margin: 0 auto 40px;
            z-index: 1;
        }

        .rope-set {
            position: absolute;
            left: 5%;
            right: 5%;
            z-index: 1;
        }

        .rope-set.top { top: 32px; }
        .rope-set.middle { top: 220px; }
        .rope-set.bottom { top: 420px; }

        .rope-canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 70px;
            pointer-events: none;
            z-index: 2;
        }

        .rope-anchor {
            position: absolute;
            top: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 42% 38%, rgba(255, 255, 255, 0.32), transparent 35%),
                radial-gradient(circle at 50% 50%, #e2c19b, #d4a373, #b8895a);
            box-shadow:
                inset 0 2px 3px rgba(255, 255, 255, 0.45),
                inset 0 -3px 6px rgba(70, 40, 20, 0.4),
                0 3px 5px rgba(0, 0, 0, 0.28),
                0 8px 16px rgba(0, 0, 0, 0.22);
            z-index: 4;
        }

        .rope-anchor.left { left: -14px; }
        .rope-anchor.right { right: -14px; }

        .rope-anchor::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(70, 45, 25, 0.55), rgba(70, 45, 25, 0.35));
            transform: translate(-50%, -50%);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35);
        }

        .rope-anchor::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
        }

        .photo-item {
            position: absolute;
            background: #ffffff;
            padding: 7px 7px 16px;
            border-radius: 4px;
            box-shadow:
                0 8px 20px rgba(180, 180, 200, 0.22),
                0 4px 10px rgba(0, 0, 0, 0.08);
            transition: all 0.4s ease;
            opacity: 0;
            animation: photoFloat 6s ease-in-out infinite;
            cursor: pointer;
            z-index: 5;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 2px;
        }

        .photo-item:hover {
            transform: translate(-50%, -50%) scale(1.15) rotate(0deg) !important;
            box-shadow:
                0 15px 35px rgba(190, 180, 210, 0.35),
                0 8px 18px rgba(0, 0, 0, 0.12);
            z-index: 20;
        }

        @keyframes photoFloat {

    0% {
        transform:
        translate(-50%, -50%)
        translateX(0)
        translateY(0)
        rotate(var(--rotate));
    }


    25% {
        transform:
        translate(-50%, -50%)
        translateX(var(--swing))
        translateY(-4px)
        rotate(calc(var(--rotate) + 2deg));
    }


    50% {
        transform:
        translate(-50%, -50%)
        translateX(0)
        translateY(-8px)
        rotate(var(--rotate));
    }


    75% {
        transform:
        translate(-50%, -50%)
        translateX(calc(var(--swing) * -1))
        translateY(-4px)
        rotate(calc(var(--rotate) - 2deg));
    }


    100% {
        transform:
        translate(-50%, -50%)
        translateX(0)
        translateY(0)
        rotate(var(--rotate));
    }

}

        .photo-item.show { opacity: 1; }

        .photo-item {
    opacity: 1;
}

        .wood-clip {
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 42px;
            height: 14px;
            background: linear-gradient(180deg, #d9a876 0%, #c18f5f 50%, #a6784a 100%);
            border-radius: 2px;
            z-index: 6;
            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 0.4),
                inset 0 -2px 4px rgba(70, 45, 20, 0.35),
                0 2px 4px rgba(0, 0, 0, 0.25);
        }

        .wood-clip::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 5px;
            height: 9px;
            background: linear-gradient(180deg, #9a9a9a, #6a6a6a);
            border-radius: 1px;
        }

        .cute-element {
            position: absolute;
            pointer-events: none;
            opacity: 0.75;
            animation: floatElement 8s ease-in-out infinite;
            z-index: 0;
            font-size: 28px;
        }

        .cute-element.star { color: #f4d66b; font-size: 22px; }
        .cute-element.heart { color: #f4b6ce; font-size: 20px; }
        .cute-element.sparkle { color: #d8c8f0; font-size: 24px; }
        .cute-element.cloud { color: #ffffff; font-size: 26px; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08)); }
        .cute-element.animal { font-size: 42px; opacity: 0.85; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.12)); }
        .cute-element.tree { font-size: 38px; opacity: 0.8; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.12)); }
        .cute-element.leaf { color: #89b96a; font-size: 20px; opacity: 0.7; }

        @keyframes floatElement {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(8deg); }
        }

        .story-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(240, 240, 250, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .story-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #fafbff;
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);

            box-shadow: 0 15px 40px rgba(160, 160, 190, 0.2);
        }

        .story-modal.active .modal-content{
            transform: scale(1);
        }

        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 16px 16px 0 0;
        }

        .modal-body { padding: 25px 30px 30px; }

        .modal-date {
            color: #a07ba8;

        }

        .modal-story {
            font-size: 1.05rem;

        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            border: none;
            color: #a87a9a;
            font-size: 20px;
            line-height: 36px;
            text-align: center;

            cursor: pointer;
        }

        .close-btn:hover { background: rgba(255, 255, 255, 0.9); }

        /* ========== 背景音乐控件 ========== */
        .music-player {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 30px;
            box-shadow: 0 4px 12px rgba(180, 160, 200, 0.15);
        }

        .music-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            color: #a87a9a;
            flex-shrink: 0;
        }

        .music-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            max-width: 200px;
        }

        .song-name {
            font-size: 0.9rem;
            color: #7a5a82;
            font-weight: 500;
            white-space: nowrap;
        }

        .lyric-line {
            font-size: 0.8rem;
            color: #9a8aa2;
            white-space: nowrap;
            overflow: hidden;
            width: 180px;
            text-align: right;
            position: relative;
            opacity: 1;
            transition: opacity 0.4s ease-in-out;
        }

        .lyric-line .lyric-content {
            display: inline-block;
        }

        .lyric-line.scrolling .lyric-content {
    animation: lyricScroll 8s linear forwards;
}

        @keyframes lyricScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            * { cursor: auto !important; }
            #cursor { display: none; }

            .page-title { padding: 14px 20px 0; }
            .page-title h1 { font-size: 1.8rem; }

            .photo-wall { min-height: 620px; }
            .rope-set.top { top: 32px; }
            .rope-set.middle { top: 270px; }
            .rope-set.bottom { top: 490px; }

            .photo-item { padding: 5px 5px 12px; }
            .wood-clip { width: 36px; height: 12px; top: -6px; }
            .wood-clip::before { width: 4px; height: 8px; }

            .cute-element.animal { font-size: 32px; }
            .cute-element.tree { font-size: 30px; }

            .continue-text {
                right: 16px;
                bottom: 16px;
                font-size: 0.9rem;
                letter-spacing: 1px;
            }

            .music-player {
                top: 12px;
                right: 12px;
                padding: 6px 10px;
                gap: 8px;
            }
            .music-icon { width: 30px; height: 30px; font-size: 18px; }
            .music-info { max-width: 140px; }
            .song-name { font-size: 0.8rem; }
            .lyric-line { width: 130px; font-size: 0.7rem; }
        }
    </style>
</head>

    <script>
        // ==================================================
        // 【照片配置区】
        // ==================================================
        const photos = [
            { src: "photo01.jpg", date: "2024.02.14", story: "第一次一起过情人节，你说这是你收到过最丑的花，但还是开心了好久。", rope: 0 },
            { src: "photo02.jpg", date: "2024.03.20", story: "周末一起去海边看日出，你冻得缩在我怀里，说日出也没什么好看的。", rope: 0 },
            { src: "photo03.jpg", date: "2024.05.01", story: "一起去爬泰山，你半路累到走不动，嘴上说着再也不爬山了，还是坚持到了山顶。", rope: 0 },
            { src: "photo04.jpg", date: "2024.06.18", story: "你生日那天，我偷偷准备了你念叨了很久的礼物，你拆礼物的时候眼睛红红的。", rope: 0 },
            { src: "photo05.jpg", date: "2024.06.18", story: "你生日那天，我偷偷准备了你念叨了很久的礼物，你拆礼物的时候眼睛红红的。", rope: 0 },
            { src: "photo06.jpg", date: "2024.06.18", story: "你生日那天，我偷偷准备了你念叨了很久的礼物，你拆礼物的时候眼睛红红的。", rope: 0 },

            { src: "photo07.jpg", date: "2024.08.09", story: "七夕节，我们在家煮了火锅，你说不用什么隆重的仪式，只要和我在一起就好。", rope: 1 },
            { src: "photo08.jpg", date: "2024.07.07", story: "国庆一起回了老家，你陪我奶奶聊了一下午的天，奶奶说这个姑娘真好。", rope: 1 },
            { src: "photo09.jpg", date: "2024.12.25", story: "圣诞节的初雪，我们在楼下踩雪，你把冻僵的手塞进我脖子里，笑得像个傻子。", rope: 1 },
            { src: "photo10.jpg", date: "2025.01.01", story: "跨年的烟花下，你说新的一年还要在一起，我说不止今年，往后每一年都要一起。", rope: 1 },
            { src: "photo11.jpg", date: "2025.02.20", story: "一起养的小猫第一次学会握手，你激动得录了十几个视频，说我们也是一家三口了。", rope: 1 },

            { src: "photo13.jpg", date: "2025.04.05", story: "春天一起去野餐，你准备了一篮子好吃的，结果大部分都进了我的肚子。", rope: 2 },
            { src: "photo14.jpg", date: "2025.06.01", story: "儿童节给你买了棒棒糖和旺仔牛奶，你说在我身边永远可以当小朋友。", rope: 2 },
            { src: "photo15.jpg", date: "2025.08.07", story: "在一起两周年，我们去拍了纪念照，你说时间过得好快，好像昨天才刚认识我。", rope: 2 },
            { src: "photo16.jpg", date: "2025.09.09", story: "你加班到很晚，我去接你，你看到我时眼睛亮得像星星。", rope: 2 },
            { src: "photo17.jpg", date: "2025.11.02", story: "一起整理房间，你把照片摆成一排，说这样看着就很幸福。", rope: 2 },
            { src: "photo18.jpg", date: "2025.11.02", story: "一起整理房间，你把照片摆成一排，说这样看着就很幸福。", rope: 2 }
        ];

        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('click', (e) => {
            for (let i = 0; i < 5; i++) {
                const heart = document.createElement('div');
                heart.className = 'click-heart';
                heart.innerHTML = '❤️';
                heart.style.left = e.clientX + (Math.random() - 0.5) * 60 + 'px';
                heart.style.top = e.clientY + (Math.random() - 0.5) * 30 + 'px';
                heart.style.fontSize = (12 + Math.random() * 12) + 'px';
                heart.style.animationDelay = (i * 0.1) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1500);
            }
        });

        const photoWall = document.getElementById('photoWall');
        const ropeSets = document.querySelectorAll('.rope-set');

        function drawTwistedRope(canvas) {
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            const width = Math.floor(rect.width);
            const height = 70;

            // 保护：宽度为0直接返回，不绘制
            if(width <= 10) return null;

            canvas.width = width;
            canvas.height = height;
            ctx.clearRect(0, 0, width, height);

            const startX = 16;
            const endX = width - 16;
            const startY = 16;
            const endY = 16;

            const midY = 38 + Math.random() * 10;
            const shadowOffsetY = 3;

            ctx.beginPath();
            ctx.moveTo(startX, startY + shadowOffsetY);
            ctx.quadraticCurveTo(width / 2, midY + shadowOffsetY + 8, endX, endY + shadowOffsetY);
            ctx.strokeStyle = 'rgba(60, 35, 15, 0.2)';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.filter = 'blur(2px)';
            ctx.stroke();
            ctx.filter = 'none';

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(width / 2, midY + 4, endX, endY);
            ctx.strokeStyle = 'rgba(90, 60, 30, 0.15)';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(width / 2, midY, endX, endY);
            ctx.strokeStyle = '#c98f5a';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(startX, startY - 1);
            ctx.quadraticCurveTo(width / 2, midY - 1.5, endX, endY - 1);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            for (let i = 0; i < 12; i++) {
                const t = i / 11;
                const x = startX + (endX - startX) * t;
                const y = (1 - t) * (1 - t) * startY + 2 * t * (1 - t) * midY + t * t * endY;

                ctx.fillStyle = 'rgba(180, 130, 90, 0.45)';
                ctx.beginPath();
                ctx.arc(x, y, 1.8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(130, 90, 60, 0.35)';
                ctx.beginPath();
                ctx.arc(x + 2, y + 2, 1.2, 0, Math.PI * 2);
                ctx.fill();
            }

            return { startX, endX, startY, endY, controlY: midY };
        }

        function renderPhotos() {
            const wallRect = photoWall.getBoundingClientRect();
            if(wallRect.width < 50){
                return;
            }

            ropeSets.forEach((set, ropeIndex) => {
                const canvas = set.querySelector('.rope-canvas');
                const curve = drawTwistedRope(canvas);
                if(!curve) return;

                const groupPhotos = photos.filter(p => p.rope === ropeIndex);
                const count = groupPhotos.length;

                const setRect = set.getBoundingClientRect();
                const setWidth = setRect.width;
                const startX = 20;
                const endX = setWidth - 20;
                const gap = (endX - startX) / (count + 1);

                const isMobile = window.innerWidth <= 768;
                const baseWidth = isMobile ? 60 : 90;
                const sizeRange = isMobile ? 20 : 28;

                groupPhotos.forEach((photo, index) => {
                    const item = document.createElement('div');
                    item.className = 'photo-item';

                    const size = baseWidth + Math.random() * sizeRange;
                    const photoHeight = size * 1.3;
                    const rotate = (Math.random() - 0.5) * 8;

                    const baseX = startX + gap * (index + 1);
                    const offsetX = (Math.random() - 0.5) * gap * 0.05;
                    const currentX = baseX + offsetX;

                    const t = (currentX - curve.startX) / (curve.endX - curve.startX);
                    const ropeY = (1 - t) * (1 - t) * curve.startY + 2 * t * (1 - t) * curve.controlY + t * t * curve.endY;

                    const itemTop = ropeY + photoHeight / 2 + Math.random() * 3;

                    item.style.width = size + 'px';
                    item.style.height = photoHeight + 'px';
                    item.style.left = currentX + 'px';
                    item.style.top = itemTop + 'px';
                    item.style.setProperty('--rotate', rotate + 'deg');
                    
                    // 设置风吹左右方向
                    const swing =
                        (index % 2 === 0 ? 1 : -1) *
                        (4 + Math.random() * 8);


                    item.style.setProperty(
                        '--swing',
                        swing + 'px'
                    );
                    
                    item.style.transform = `translate(-50%, -50%) rotate(${rotate}deg)`;
                    item.style.animationDelay = (index * 0.18 + Math.random())+"s";

                    item.innerHTML = `
                        <div class="wood-clip"></div>
                        <img src="${photo.src}" alt="照片" loading="lazy">
                    `;

                    item.addEventListener('click', () => {
                        openModal(photo);
                    });

                    set.appendChild(item);

                    setTimeout(() => {
                        item.classList.add('show');
                    }, 350 + index * 120 + ropeIndex * 180);
                });
            });

            addCuteElements();

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let snowflakes = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class SnowFlake {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = 2 + Math.random() * 5;
                this.speed = 0.3 + Math.random() * 1;
                this.opacity = 0.4 + Math.random() * 0.5;
                this.swayOffset = Math.random() * Math.PI * 2;
                this.swaySpeed = 0.005 + Math.random() * 0.01;
            }

            update() {
                this.y += this.speed;
                this.x += Math.sin(this.y * this.swaySpeed + this.swayOffset) * 0.8;

                if (this.y > canvas.height + 20) {
                    this.reset();
                }
            }

           draw() {
    ctx.save();

    ctx.globalAlpha = this.opacity;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.2;

    ctx.translate(this.x, this.y);

    // 雪花六角旋转
    for (let i = 0; i < 6; i++) {

        ctx.rotate(Math.PI / 3);

        ctx.beginPath();

        ctx.moveTo(0, 0);
        ctx.lineTo(0, -this.size * 2);

        // 雪花枝杈
        ctx.moveTo(0, -this.size * 1.2);
        ctx.lineTo(-this.size * 0.5, -this.size * 1.7);

        ctx.moveTo(0, -this.size * 1.2);
        ctx.lineTo(this.size * 0.5, -this.size * 1.7);

        ctx.stroke();
    }

    ctx.restore();
}
        }

        function initSnowflakes() {
            snowflakes = [];
            const count = Math.floor(canvas.width / 25);

            for (let i = 0; i < count; i++) {
                snowflakes.push(new SnowFlake());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            snowflakes.forEach(s => {
                s.update();
                s.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('load', () => {
            renderPhotos();
            initSnowflakes();
            animate();

        // 4秒一圈，每帧旋转角度

        function startIconRotate(){
            function tick(){
                iconRotateDeg += rotateStep;
                musicIcon.style.transform = `rotate(${iconRotateDeg}deg)`;

            }
            tick();
        }

        function stopIconRotate(){
            if(rotateAnimId){
                cancelAnimationFrame(rotateAnimId);
                rotateAnimId = null;
            }
        }

} else {

    lyricLine.classList.remove('scrolling');

}
