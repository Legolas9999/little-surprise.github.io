<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="我们的故事，一段关于相遇、陪伴、离别与重逢的回忆。"
    />

    <!-- Supabase 路径保持不变 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <title>我们的故事</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap");

      :root {
        --paper: #f6f1e9;
        --paper-deep: #eee6da;
        --ink: #403a35;
        --muted: #8b8178;
        --soft: #b6a99d;
        --accent: #b67c76;
        --accent-soft: #d8aaa2;
        --rope: #a87951;
        --white: rgba(255, 255, 255, 0.78);

        --shadow-soft:
          0 20px 60px rgba(91, 72, 58, 0.1), 0 4px 18px rgba(91, 72, 58, 0.06);

        --shadow-photo:
          0 18px 40px rgba(65, 48, 37, 0.15), 0 4px 12px rgba(65, 48, 37, 0.08);

        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100dvh;
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(
            circle at 12% 10%,
            rgba(255, 255, 255, 0.85),
            transparent 27%
          ),
          radial-gradient(
            circle at 86% 72%,
            rgba(211, 188, 168, 0.18),
            transparent 28%
          ),
          linear-gradient(135deg, #faf7f1 0%, var(--paper) 46%, #eee7dc 100%);
        font-family: "Manrope", "PingFang SC", "Microsoft YaHei", sans-serif;
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.34;
        background-image: radial-gradient(
          rgba(75, 55, 40, 0.13) 0.6px,
          transparent 0.6px
        );
        background-size: 5px 5px;
        mix-blend-mode: multiply;
      }

      body.locked {
        overflow: hidden;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
      }

      img {
        max-width: 100%;
      }

      /* =========================================================
       Ambient background
    ========================================================= */

      #bgCanvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0.48;
      }

      .ambient-orb {
        position: fixed;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        pointer-events: none;
        filter: blur(70px);
        opacity: 0.16;
        z-index: 0;
      }

      .ambient-orb.one {
        left: -100px;
        top: 30%;
        background: #d5b8a2;
      }

      .ambient-orb.two {
        right: -120px;
        top: 55%;
        background: #c6aaa0;
      }

      /* =========================================================
       Header
    ========================================================= */

      .page-header {
        width: min(1240px, calc(100% - 48px));
        margin: 0 auto;
        padding: 44px 0 20px;
        position: relative;
        z-index: 2;
      }

      .header-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .header-meta span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .header-meta span::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
      }

      .page-title {
        padding: 58px 0 0;
        max-width: 760px;
      }

      .eyebrow {
        color: var(--accent);
        font-family: "DM Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        margin-bottom: 20px;
      }

      .story-title-img {
        width: min(420px, 78vw);
        height: auto;
        display: block;
        margin: 0;
        filter: saturate(0.72);
      }

      .title-copy {
        max-width: 600px;
        margin-top: 22px;
        color: var(--muted);
        font-size: 14px;
        line-height: 2;
        letter-spacing: 0.02em;
      }

      .title-rule {
        width: 100%;
        height: 1px;
        margin-top: 42px;
        background: linear-gradient(
          90deg,
          rgba(166, 128, 106, 0.55),
          rgba(166, 128, 106, 0.12),
          transparent
        );
      }

      /* =========================================================
       Music player
    ========================================================= */

      .music-player {
        position: fixed;
        top: 24px;
        right: 28px;
        z-index: 900;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 9px 11px 9px 16px;
        background: rgba(250, 247, 241, 0.74);
        border: 1px solid rgba(255, 255, 255, 0.75);
        box-shadow: var(--shadow-soft);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-radius: 16px;
      }

      .music-info {
        min-width: 0;
        max-width: 190px;
        text-align: right;
      }

      .song-name {
        color: var(--ink);
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }

      .lyric-line {
        width: 180px;
        margin-top: 3px;
        overflow: hidden;
        color: var(--muted);
        font-size: 9px;
        white-space: nowrap;
        text-align: right;
        opacity: 0.85;

        transition:
          opacity 0.65s var(--ease),
          transform 0.65s var(--ease);
        transform: translateY(0);
      }

      .lyric-line .lyric-content {
        display: inline-block;
      }

      .lyric-line.scrolling .lyric-content {
        animation: lyricScroll 7s linear forwards;
      }

      @keyframes lyricScroll {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      .music-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        color: var(--accent);
        background: rgba(255, 255, 255, 0.72);
        cursor: pointer;
        transition:
          transform 0.5s var(--ease),
          background 0.35s var(--ease);
      }

      .music-icon:hover {
        transform: scale(1.06);
        background: rgba(255, 255, 255, 0.95);
      }

      .music-icon:active {
        transform: scale(0.94);
      }

      /* =========================================================
       Continue image
    ========================================================= */

      .continue-text {
        position: fixed;
        right: 30px;
        bottom: 26px;
        width: 175px;
        z-index: 10;
        pointer-events: none;
        opacity: 0.78;
        animation: continueFloat 4s var(--ease) infinite;
      }

      .continue-text img {
        display: block;
        width: 100%;
        height: auto;
      }

      @keyframes continueFloat {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }
        50% {
          transform: translateY(-8px) rotate(1deg);
        }
      }

      /* =========================================================
       Photo wall
    ========================================================= */

      .photo-wall {
        width: min(1240px, calc(100% - 48px));
        min-height: 850px;
        margin: 0 auto;
        position: relative;
        z-index: 2;
      }

      .rope-set {
        position: absolute;
        left: 4%;
        right: 4%;
        height: 190px;
        z-index: 2;
      }

      .rope-set.top {
        top: 25px;
      }

      .rope-set.middle {
        top: 245px;
      }

      .rope-set.bottom {
        top: 470px;
      }

      .rope-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 70px;
        pointer-events: none;
        z-index: 1;
      }

      .rope-anchor {
        position: absolute;
        top: 0;
        width: 27px;
        height: 27px;
        border-radius: 50%;
        background:
          radial-gradient(
            circle at 38% 32%,
            rgba(255, 255, 255, 0.45),
            transparent 30%
          ),
          linear-gradient(145deg, #d4a779, #9a6745);
        box-shadow:
          inset 0 2px 4px rgba(255, 255, 255, 0.45),
          0 5px 12px rgba(76, 54, 39, 0.18);
        z-index: 3;
      }

      .rope-anchor.left {
        left: -10px;
      }

      .rope-anchor.right {
        right: -10px;
      }

      .photo-item {
        position: absolute;
        background: #fffdf9;
        padding: 6px 6px 15px;
        cursor: pointer;
        opacity: 0;
        z-index: 5;
        box-shadow: var(--shadow-photo);
        transform-origin: 50% -10px;

        animation:
          photoReveal 0.9s var(--ease) forwards,
          photoSway 7s ease-in-out infinite;

        transition:
          box-shadow 0.5s var(--ease),
          filter 0.5s var(--ease);
      }

      .photo-item.show {
        opacity: 1;
      }

      /*
      缩略图同样不裁剪。
      原照片保持完整比例，只限制显示区域尺寸。
    */
      .photo-item img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        background: #f2eee7;
        border-radius: 1px;
      }

      .photo-item:hover {
        z-index: 30;
        box-shadow:
          0 28px 55px rgba(63, 45, 35, 0.22),
          0 7px 20px rgba(63, 45, 35, 0.12);
        filter: brightness(1.025);
      }

      .wood-clip {
        position: absolute;
        top: -7px;
        left: 50%;
        width: 42px;
        height: 14px;
        transform: translateX(-50%);
        border-radius: 2px;
        background: linear-gradient(180deg, #d5a576, #b77d4e);
        box-shadow:
          inset 0 1px 2px rgba(255, 255, 255, 0.45),
          0 3px 7px rgba(60, 40, 25, 0.18);
        z-index: 10;
      }

      .wood-clip::before {
        content: "";
        position: absolute;
        width: 5px;
        height: 9px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 1px;
        background: #707070;
      }

      @keyframes photoReveal {
        from {
          opacity: 0;
          transform: translate(-50%, -35%) scale(0.88) rotate(var(--rotate));
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1) rotate(var(--rotate));
        }
      }

      @keyframes photoSway {
        0%,
        100% {
          margin-left: 0;
          rotate: var(--rotate);
        }
        25% {
          margin-left: var(--swing);
          rotate: calc(var(--rotate) + 1.7deg);
        }
        50% {
          margin-left: 0;
          rotate: var(--rotate);
        }
        75% {
          margin-left: calc(var(--swing) * -1);
          rotate: calc(var(--rotate) - 1.7deg);
        }
      }

      /* =========================================================
       Decorative elements
    ========================================================= */

      .cute-element {
        position: absolute;
        z-index: 1;
        pointer-events: none;
        opacity: 0.42;
        filter: grayscale(0.15);
        animation: decorFloat 8s ease-in-out infinite;
      }

      .cute-element.animal,
      .cute-element.tree {
        font-size: 34px;
      }

      .cute-element.leaf,
      .cute-element.heart {
        font-size: 22px;
      }

      .cute-element.star,
      .cute-element.sparkle {
        font-size: 20px;
      }

      @keyframes decorFloat {
        0%,
        100% {
          transform: translateY(0) rotate(0);
        }
        50% {
          transform: translateY(-10px) rotate(4deg);
        }
      }

      /* =========================================================
       Story modal — entire image visible
    ========================================================= */

      .story-modal {
        position: fixed;
        inset: 0;
        z-index: 5000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
        background: rgba(42, 34, 29, 0.52);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);

        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transition:
          opacity 0.5s var(--ease),
          visibility 0.5s var(--ease);
      }

      .story-modal.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      /*
      关键：
      modal-content 不再固定图片高度。
      图片使用 contain + auto，确保整张照片始终显示。
    */
      .modal-content {
        position: relative;
        width: min(1100px, 94vw);
        max-height: calc(100dvh - 56px);

        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.55fr);

        overflow: hidden;

        background: rgba(248, 245, 239, 0.96);
        border-radius: 22px;
        box-shadow:
          0 40px 100px rgba(20, 15, 12, 0.28),
          0 10px 30px rgba(20, 15, 12, 0.16);

        transform: translateY(30px) scale(0.96);
        transition: transform 0.65s var(--ease);
      }

      .story-modal.active .modal-content {
        transform: translateY(0) scale(1);
      }

      .modal-image-stage {
        min-width: 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;

        background: radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0.92),
          rgba(231, 223, 211, 0.92)
        );

        touch-action: pan-y;
      }

      .modal-content img {
        /*
        永不裁切：
        contain + max-width/max-height 保证整个图片完整出现。
      */
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: calc(100dvh - 112px);
        object-fit: contain;
        object-position: center;
        border-radius: 8px;
        box-shadow: 0 16px 36px rgba(53, 42, 33, 0.16);
      }

      /* =========================================================
   图片二次点击：全屏大图模式
========================================================= */

      .story-modal.image-expanded .modal-content {
        width: 100vw;
        height: 100dvh;
        max-width: none;
        max-height: none;

        display: flex;
        align-items: center;
        justify-content: center;

        background: transparent;
        border-radius: 0;
        box-shadow: none;
      }

      .story-modal.image-expanded .modal-image-stage {
        width: 100%;
        height: 100%;
        padding: 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: transparent;
      }

      .story-modal.image-expanded .modal-content img {
        width: auto;
        height: auto;

        max-width: 100%;
        max-height: calc(100dvh - 40px);

        object-fit: contain;
        border-radius: 4px;

        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);

        cursor: zoom-out;

        transform-origin: center center;
        transition: none;
        touch-action: none;
        will-change: transform;
      }

      .story-modal.image-expanded .modal-body {
        display: none;
      }
      .modal-body {
        min-width: 0;
        overflow-y: auto;
        padding: 52px 38px 42px;
        background: rgba(250, 247, 242, 0.96);
      }

      .modal-index {
        color: var(--soft);
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        margin-bottom: 18px;
      }

      .modal-date {
        color: var(--accent);
        font-family: "DM Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        margin-bottom: 22px;
      }

      .modal-story {
        color: #625950;
        font-size: 14px;
        line-height: 2.05;
        white-space: pre-line;
        word-break: break-word;
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        z-index: 20;

        width: 38px;
        height: 38px;

        display: grid;
        place-items: center;

        color: #5f554d;
        background: rgba(255, 255, 255, 0.72);
        border-radius: 12px;
        cursor: pointer;

        font-size: 21px;
        font-weight: 300;

        box-shadow: 0 8px 22px rgba(50, 40, 32, 0.1);

        transition:
          transform 0.4s var(--ease),
          background 0.3s var(--ease);
      }

      .close-btn:hover {
        transform: rotate(90deg) scale(1.06);
        background: #fff;
      }

      .close-btn:active {
        transform: scale(0.92);
      }

      /* =========================================================
       Message board
    ========================================================= */

      .message-board {
        width: min(980px, calc(100% - 48px));
        margin: 20px auto 150px;
        position: relative;
        z-index: 2;
      }

      .message-header {
        max-width: 650px;
        margin: 0 auto 44px;
        text-align: center;
      }

      .message-kicker {
        color: var(--accent);
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.18em;
        margin-bottom: 14px;
      }

      .message-header h2 {
        color: var(--ink);
        font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1.2;
        text-wrap: balance;
      }

      .message-header p {
        margin-top: 16px;
        color: var(--muted);
        font-size: 13px;
        line-height: 2;
      }

      .message-form {
        width: min(650px, 100%);
        margin: 0 auto;
        padding: 30px;

        background: rgba(255, 255, 255, 0.54);
        border: 1px solid rgba(255, 255, 255, 0.76);
        border-radius: 20px;

        box-shadow: var(--shadow-soft);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .input-wrap,
      .textarea-wrap {
        position: relative;
      }

      .input-wrap {
        margin-bottom: 12px;
      }

      #commentName,
      #commentMessage {
        width: 100%;
        border: 1px solid rgba(157, 133, 116, 0.18);
        outline: none;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.65);

        transition:
          border-color 0.35s var(--ease),
          box-shadow 0.35s var(--ease),
          background 0.35s var(--ease);
      }

      #commentName {
        height: 48px;
        padding: 0 17px;
        border-radius: 12px;
        font-size: 13px;
      }

      #commentMessage {
        min-height: 145px;
        padding: 15px 17px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.9;
        resize: vertical;
      }

      #commentName::placeholder,
      #commentMessage::placeholder {
        color: #b4a99f;
      }

      #commentName:focus,
      #commentMessage:focus {
        border-color: rgba(182, 124, 118, 0.5);
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 0 0 4px rgba(182, 124, 118, 0.08);
      }

      .message-submit {
        width: 100%;
        margin-top: 14px;
        min-height: 48px;

        border-radius: 12px;
        color: #fff;
        background: var(--ink);
        cursor: pointer;

        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;

        box-shadow: 0 10px 24px rgba(64, 58, 53, 0.15);

        transition:
          transform 0.45s var(--ease),
          background 0.45s var(--ease),
          box-shadow 0.45s var(--ease);
      }

      .message-submit:hover {
        transform: translateY(-2px);
        background: #514942;
        box-shadow: 0 15px 32px rgba(64, 58, 53, 0.2);
      }

      .message-submit:active {
        transform: translateY(1px) scale(0.985);
      }

      .submit-heart {
        margin-left: 7px;
        opacity: 0.8;
      }

      .comments-title {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        margin: 70px 0 28px;

        color: var(--muted);
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.15em;
      }

      .comments-title::before,
      .comments-title::after {
        content: "";
        width: min(120px, 16vw);
        height: 1px;
        background: rgba(139, 129, 120, 0.25);
      }

      #commentsList {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .comment-item {
        position: relative;
        min-height: 220px;
        padding: 30px;

        background: rgba(255, 255, 255, 0.65);
        border-radius: 16px;

        box-shadow: 0 14px 38px rgba(73, 56, 44, 0.07);

        transition:
          transform 0.45s var(--ease),
          box-shadow 0.45s var(--ease);
      }

      .comment-item:hover {
        transform: translateY(-4px);
        box-shadow: 0 22px 48px rgba(73, 56, 44, 0.11);
      }

      .comment-name {
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
      }

      .comment-message {
        margin-top: 18px;
        color: #645a53;
        font-size: 13px;
        line-height: 1.9;
        white-space: pre-line;
        word-break: break-word;

        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 6;
        overflow: hidden;
      }

      .comment-message.expanded {
        display: block;
        overflow: visible;
      }

      .comment-more {
        display: none;
        margin-top: 10px;
        padding: 0;
        color: var(--accent);
        background: transparent;
        cursor: pointer;
        font-size: 11px;
      }

      .comment-time {
        margin-top: 20px;
        padding-top: 12px;
        border-top: 1px solid rgba(139, 129, 120, 0.13);

        color: var(--soft);
        font-family: "DM Mono", monospace;
        font-size: 9px;
        text-align: right;
        letter-spacing: 0.08em;
      }

      .empty-comments {
        grid-column: 1 / -1;
        padding: 50px 20px;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.46);
        border-radius: 18px;
      }

      .empty-heart {

        ctx.strokeStyle = "rgba(60,35,15,.14)";
        ctx.lineWidth = 7;
        ctx.lineCap = "round";
        ctx.filter = "blur(2px)";
        ctx.stroke();

        ctx.filter = "none";

        ctx.beginPath();
        ctx.moveTo(startX, startY);

        ctx.quadraticCurveTo(width / 2, midY, endX, endY);

        ctx.strokeStyle = "#aa7650";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.moveTo(startX, startY - 1);

        ctx.strokeStyle = "rgba(255,255,255,.32)";
        ctx.lineWidth = 1.4;
        ctx.stroke();

          endY,
          controlY: midY,

        requestAnimationFrame(animateSnow);
      }

      resizeCanvas();
      initSnowflakes();
      animateSnow();

      window.addEventListener("resize", () => {
        resizeCanvas();
        initSnowflakes();
      });

      /* =========================================================

          { time: 196, text: "いつか誰かとまた恋に落ちても" },
          { time: 203, text: "I'll remember to love" },
          { time: 206, text: "You taught me how" },
          { time: 209, text: "You are always gonna be the one" },
          { time: 214, text: "まだ悲しいlove song" },
          { time: 221, text: "Now and forever" },
        ],
      };

      const bgmAudio = new Audio(musicConfig.src);

      bgmAudio.loop = true;

      const musicIcon = document.getElementById("musicIcon");

      const lyricLine = document.getElementById("lyricLine");

      const songNameEl = document.querySelector(".song-name");

      songNameEl.textContent = musicConfig.songName;

      let isPlaying = false;
      let iconRotateDeg = 0;
      let rotateAnimId = null;
      let userStartedMusic = false;

      function startIconRotate() {
        if (rotateAnimId) return;

        function tick() {
          iconRotateDeg += 1.2;

          musicIcon.style.transform = `rotate(${iconRotateDeg}deg)`;

          rotateAnimId = requestAnimationFrame(tick);
        }

        tick();
      }

      function stopIconRotate() {
        if (rotateAnimId) {
          cancelAnimationFrame(rotateAnimId);

          rotateAnimId = null;
        }
      }

      musicIcon.addEventListener("click", (event) => {
        event.stopPropagation();

        if (isPlaying) {
          bgmAudio.pause();

          stopIconRotate();

          isPlaying = false;
        } else {
          bgmAudio
            .play()
            .then(() => {
              isPlaying = true;
              userStartedMusic = true;

              startIconRotate();
            })
            .catch(() => {
              lyricLine.textContent = "播放失败，请检查音乐文件";
            });
        }
      });

      /*
      用户第一次点击页面时开始播放。
      保留原来的交互逻辑。
    */
      document.addEventListener(
        "click",
        (event) => {
          if (event.target.closest("#musicIcon")) {
            return;
          }

          if (!userStartedMusic) {
            bgmAudio
              .play()
              .then(() => {
                isPlaying = true;
                userStartedMusic = true;

                startIconRotate();
              })
              .catch(() => {});
          }
        },
        { passive: true },
      );

      let currentLyricIndex = -1;
      let isLyricSwitching = false;

      function switchLyric(index) {
        if (isLyricSwitching || index === currentLyricIndex) {
          return;
        }

        isLyricSwitching = true;
        currentLyricIndex = index;

        const text = musicConfig.lyrics[index].text;

        lyricLine.style.opacity = "0.15";
        lyricLine.style.transform = "translateY(4px)";

        setTimeout(() => {
          lyricLine.innerHTML = `<span class="lyric-content">${text}</span>`;

          const content = lyricLine.querySelector(".lyric-content");

          if (content.scrollWidth > lyricLine.clientWidth) {
            lyricLine.classList.add("scrolling");
          } else {
            lyricLine.classList.remove("scrolling");
          }

          requestAnimationFrame(() => {
            lyricLine.style.opacity = "1";
            lyricLine.style.transform = "translateY(0)";
          });

          setTimeout(() => {
            isLyricSwitching = false;
          }, 400);
        }, 450);
      }

      bgmAudio.addEventListener("timeupdate", () => {
        const currentTime = bgmAudio.currentTime;

        let targetIndex = 0;

        for (let i = musicConfig.lyrics.length - 1; i >= 0; i--) {
          if (currentTime >= musicConfig.lyrics[i].time) {
            targetIndex = i;
            break;
          }
        }

        switchLyric(targetIndex);
      });

      bgmAudio.addEventListener("error", () => {
        lyricLine.textContent = "音乐文件加载失败";
      });

      /* =========================================================
       Comments
       数据库表与路径保持不变
    ========================================================= */

      const nameInput = document.getElementById("commentName");

      const messageInput = document.getElementById("commentMessage");

      const submitCommentButton = document.getElementById("submitComment");

      async function submitComment() {
        const name = nameInput.value.trim();

        const message = messageInput.value.trim();

        if (!name) {
          nameInput.focus();
          return;
        }

        if (!message) {
          messageInput.focus();
          return;
        }

        submitCommentButton.disabled = true;

        submitCommentButton.style.opacity = ".65";

        const { data, error } = await supabaseClient.from("comments").insert([
          {
            name,
            message,
          },
        ]);

        submitCommentButton.disabled = false;

        submitCommentButton.style.opacity = "";

        if (error) {
          console.error("留言提交失败：", error);

          return;
        }

        nameInput.value = "";
        messageInput.value = "";

        await loadComments();
      }

      submitCommentButton.addEventListener("click", submitComment);

      async function loadComments() {
        const { data, error } = await supabaseClient
          .from("comments")
          .select("*")
          .order("created_at", {
            ascending: false,
          });

        if (error) {
          console.error("读取留言失败：", error);

          return;
        }

        const commentsList = document.getElementById("commentsList");

        commentsList.innerHTML = "";

        if (!data || data.length === 0) {
          commentsList.innerHTML = `
          <div class="empty-comments">
            <div class="empty-heart">♡</div>
            <div>还没有留言</div>
            <small>
              成为第一个留下心意的人
            </small>
          </div>
        `;

          return;
        }

        data.forEach((comment, index) => {
          const item = document.createElement("article");

          item.className = "comment-item";

          item.innerHTML = `
            <div class="comment-name">
              ♡ ${escapeHtml(comment.name)}
            </div>

            <div class="comment-message">
              ${escapeHtml(comment.message)}
            </div>

            <button
              class="comment-more"
              type="button"
            >
              查看全文 ↓
            </button>

            <div class="comment-time">
              ${formatCommentTime(comment.created_at)}
            </div>
          `;

          const messageElement = item.querySelector(".comment-message");

          const moreButton = item.querySelector(".comment-more");

          commentsList.appendChild(item);

          requestAnimationFrame(() => {
            if (messageElement.scrollHeight > messageElement.clientHeight + 2) {
              moreButton.style.display = "inline-block";

              moreButton.addEventListener("click", () => {
                const expanded = messageElement.classList.contains("expanded");

                if (expanded) {
                  messageElement.classList.remove("expanded");

                  moreButton.textContent = "查看全文 ↓";
                } else {
                  messageElement.classList.add("expanded");

                  moreButton.textContent = "收起 ↑";
                }
              });
            }
          });
        });
      }

      function formatCommentTime(time) {
        const date = new Date(time);

        const year = date.getFullYear();

        const month = String(date.getMonth() + 1).padStart(2, "0");

        const day = String(date.getDate()).padStart(2, "0");

        return `${year}.${month}.${day}`;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
      }

      /* =========================================================
       Password
    ========================================================= */

      const PASSWORD = "250521";

      const overlay = document.getElementById("passwordOverlay");

      const passwordInput = document.getElementById("passwordInput");

      const unlockBtn = document.getElementById("unlockBtn");

      const errorMsg = document.getElementById("errorMsg");

      function unlock() {
        if (passwordInput.value === PASSWORD) {
          overlay.style.opacity = "0";

          document.body.classList.remove("locked");

          // 手机端进入主页面时，强制恢复到 100% 缩放
          if (window.innerWidth <= 768) {
            document.documentElement.style.zoom = "1";
            document.body.style.zoom = "1";

            // 延迟一帧，确保密码层消失后重新计算页面布局
            requestAnimationFrame(() => {
              window.scrollTo(0, 0);

              document.documentElement.style.zoom = "1";
              document.body.style.zoom = "1";
            });
          }

          setTimeout(() => {
            overlay.style.display = "none";

            // 密码层完全消失后再次确保页面保持 1:1
            if (window.innerWidth <= 768) {
              document.documentElement.style.zoom = "1";
              document.body.style.zoom = "1";
              window.scrollTo(0, 0);
            }
          }, 800);
        } else {
          errorMsg.style.display = "block";

          passwordInput.value = "";

          passwordInput.focus();
        }
      }
      unlockBtn.addEventListener("click", unlock);

      passwordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          unlock();
        }
      });

      /* =========================================================
       Init
    ========================================================= */

      window.addEventListener("load", () => {
        renderPhotos();

        loadComments();

        passwordInput.focus();
      });

      const fullscreenCounter = document.getElementById("fullscreenCounter");

      function updateFullscreenImageCounter(index) {
        fullscreenCounter.textContent = `Image ${String(index + 1).padStart(2, "0")}/${String(photos.length).padStart(2, "0")}`;
      }
