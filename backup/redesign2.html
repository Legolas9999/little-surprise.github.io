<!doctype html>
<html lang="zh-CN">
<head>
  <!-- 原有 Supabase 依赖，保持不变 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="一些我们一起走过的地方，一些没有被时间带走的记忆。"
  />

  <title>我们的故事</title>

  <style>
    /*
      ============================================================
      REDESIGN SYSTEM
      Editorial Luxury + Z-Axis Cascade
      ============================================================
    */

    :root {
      --paper: #f4efe7;
      --paper-light: #faf7f1;
      --paper-deep: #e9dfd2;

      --ink: #27231f;
      --ink-soft: #625a52;
      --ink-muted: #8b8177;

      --accent: #9d655e;
      --accent-soft: #c8958a;
      --accent-pale: #ead6ce;

      --rope: #a9784d;
      --rope-dark: #725033;
      --wood: #b98252;
      --wood-light: #d5a675;

      --white: rgba(255, 255, 255, 0.78);

      --ease-fluid: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-spring: cubic-bezier(0.22, 1.18, 0.36, 1);

      --z-background: 0;
      --z-content: 10;
      --z-floating: 30;
      --z-overlay: 100;
      --z-modal: 200;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none !important;
    }

    html {
      scroll-behavior: smooth;
      background: var(--paper);
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(
          circle at 12% 12%,
          rgba(255, 255, 255, 0.92),
          transparent 28%
        ),
        radial-gradient(
          circle at 86% 72%,
          rgba(205, 168, 147, 0.12),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #f8f4ed 0%,
          #eee6dc 48%,
          #f5eee5 100%
        );
      font-family:
        "Plus Jakarta Sans",
        "Noto Sans SC",
        "PingFang SC",
        sans-serif;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: var(--z-background);
      pointer-events: none;
      opacity: 0.18;
      background-image:
        radial-gradient(
          rgba(50, 40, 30, 0.15) 0.6px,
          transparent 0.6px
        );
      background-size: 5px 5px;
      mix-blend-mode: multiply;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: var(--z-background);
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          transparent 0,
          rgba(95, 72, 53, 0.025) 50%,
          transparent 100%
        );
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    img {
      max-width: 100%;
    }

    ::selection {
      color: var(--paper-light);
      background: var(--accent);
    }

    /*
      ============================================================
      CUSTOM CURSOR
      ============================================================
    */

    #cursor {
      position: fixed;
      width: 18px;
      height: 18px;
      left: 0;
      top: 0;
      z-index: var(--z-modal);
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition:
        width 500ms var(--ease-spring),
        height 500ms var(--ease-spring),
        opacity 300ms var(--ease-fluid);
    }

    #cursor::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(157, 101, 94, 0.75);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.35) inset;
    }

    #cursor::after {
      content: "";
      position: absolute;
      width: 3px;
      height: 3px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--accent);
    }

    body.cursor-hover #cursor {
      width: 42px;
      height: 42px;
    }

    @media (max-width: 768px) {
      * {
        cursor: auto !important;
      }

      #cursor {
        display: none;
      }
    }

    /*
      ============================================================
      BACKGROUND CANVAS
      ============================================================
    */

    #bgCanvas {
      position: fixed;
      inset: 0;
      z-index: var(--z-background);
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.32;
    }

    /*
      ============================================================
      TOP MUSIC ISLAND
      ============================================================
    */

    .music-player {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: var(--z-floating);

      display: flex;
      align-items: center;
      gap: 14px;

      min-width: 235px;
      padding: 8px 9px 8px 18px;

      border-radius: 999px;

      background: rgba(250, 247, 241, 0.78);
      box-shadow:
        0 12px 38px rgba(82, 58, 42, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      transition:
        transform 650ms var(--ease-spring),
        box-shadow 500ms var(--ease-fluid);
    }

    .music-player:hover {
      transform: translateY(-2px);
      box-shadow:
        0 18px 44px rgba(82, 58, 42, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .music-info {
      min-width: 0;
      flex: 1;
    }

    .song-name {
      color: var(--ink);
      font-family:
        "Cormorant Garamond",
        "Noto Serif SC",
        serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .lyric-line {
      width: 165px;
      margin-top: 2px;
      overflow: hidden;
      color: var(--ink-muted);
      font-size: 10px;
      letter-spacing: 0.05em;
      white-space: nowrap;
      opacity: 1;
      transition: opacity 400ms var(--ease-fluid);
    }

    .lyric-content {
      display: inline-block;
    }

    .lyric-line.scrolling .lyric-content {
      animation: lyricScroll 8s linear forwards;
    }

    @keyframes lyricScroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .music-icon {
      position: relative;
      display: grid;
      place-items: center;

      width: 38px;
      height: 38px;

      border-radius: 50%;

      background: var(--ink);
      color: var(--paper-light);

      font-size: 15px;

      cursor: pointer;

      transition:
        transform 600ms var(--ease-spring),
        background 450ms var(--ease-fluid);
    }

    .music-icon:hover {
      transform: scale(1.08);
      background: var(--accent);
    }

    .music-icon:active {
      transform: scale(0.94);
    }

    /*
      ============================================================
      INTRO / TITLE
      ============================================================
    */

    .page-title {
      position: relative;
      z-index: var(--z-content);

      width: min(1180px, calc(100% - 48px));
      min-height: 390px;

      margin: 0 auto;

      padding:
        clamp(125px, 15vw, 190px)
        0
        70px;

      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 0.72fr);
      align-items: end;
      gap: 70px;
    }

    .title-copy {
      position: relative;
      max-width: 780px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;

      margin-bottom: 24px;
      padding: 7px 12px;

      border-radius: 999px;

      background: rgba(255, 255, 255, 0.45);

      color: var(--accent);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .title-copy h1 {
      color: var(--ink);
      font-family:
        "Cormorant Garamond",
        "Noto Serif SC",
        serif;

      font-size: clamp(72px, 10vw, 145px);
      font-weight: 500;
      line-height: 0.83;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    .title-copy h1 span {
      display: block;
      margin-left: 0.7em;
      color: var(--accent);
      font-style: italic;
    }

    .title-copy p {
      max-width: 390px;
      margin-top: 32px;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 2;
      letter-spacing: 0.03em;
    }

    .title-mark {
      justify-self: end;
      align-self: end;

      position: relative;

      width: 240px;
      height: 240px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          rgba(255, 255, 255, 0.72),
          transparent 32%
        ),
        rgba(255, 255, 255, 0.22);

      box-shadow:
        0 30px 80px rgba(83, 57, 43, 0.09),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .title-mark::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(157, 101, 94, 0.24);
      border-radius: 50%;
    }

    .title-mark::after {
      content: "2025 - 2026";
      position: absolute;
      bottom: 34px;

      color: var(--ink-muted);
      font-size: 9px;
      letter-spacing: 0.25em;
    }

    .story-title-img {
      width: 155px;
      height: auto;
      opacity: 0.9;
    }

    /*
      ============================================================
      PHOTO WALL
      ============================================================
    */

    .photo-wall {
      position: relative;
      z-index: var(--z-content);

      width: min(1260px, calc(100% - 48px));
      min-height: 860px;

      margin: 0 auto;

      padding-bottom: 120px;
    }

    .wall-intro {
      width: min(460px, 100%);
      margin-bottom: 40px;
      margin-left: 8%;

      display: flex;
      align-items: baseline;
      gap: 18px;
    }

    .wall-intro strong {
      color: var(--ink);
      font-family:
        "Cormorant Garamond",
        "Noto Serif SC",
        serif;
      font-size: 28px;
      font-weight: 600;
    }

    .wall-intro span {
      color: var(--ink-muted);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .rope-set {
      position: absolute;
      left: 5%;
      right: 5%;
      height: 245px;
    }

    .rope-set.top {
      top: 105px;
    }

    .rope-set.middle {
      top: 335px;
    }

    .rope-set.bottom {
      top: 570px;
    }

    .rope-canvas {
      position: absolute;
      left: 0;
      top: 0;

      width: 100%;
      height: 90px;

      pointer-events: none;
      z-index: 2;
    }

    .rope-anchor {
      position: absolute;
      top: 3px;

      width: 25px;
      height: 25px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          rgba(255, 255, 255, 0.5),
          transparent 28%
        ),
        linear-gradient(
          145deg,
          var(--wood-light),
          var(--wood)
        );

      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.5),
        inset 0 -3px 5px rgba(68, 39, 20, 0.25),
        0 8px 15px rgba(70, 44, 27, 0.12);

      z-index: 4;
    }

    .rope-anchor.left {
      left: -12px;
    }

    .rope-anchor.right {
      right: -12px;
    }

    .rope-anchor::after {
      content: "";
      position: absolute;

      width: 6px;
      height: 6px;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      border-radius: 50%;
      background: rgba(77, 47, 28, 0.48);
    }

    /*
      PHOTO OBJECT
    */

    .photo-item {
      position: absolute;

      padding: 8px 8px 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.99),
          rgba(245, 240, 233, 0.96)
        );

      box-shadow:
        0 26px 45px rgba(73, 53, 40, 0.12),
        0 8px 15px rgba(73, 53, 40, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);

      opacity: 0;

      cursor: pointer;

      transform-origin: 50% -15px;

      transition:
        transform 850ms var(--ease-spring),
        box-shadow 650ms var(--ease-fluid),
        opacity 900ms var(--ease-fluid);

      z-index: 5;
      will-change: transform;
    }

    .photo-item.show {
      opacity: 1;
    }

    .photo-item img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      filter: saturate(0.9) contrast(0.98);

      transition:
        filter 800ms var(--ease-fluid),
        transform 900ms var(--ease-spring);
    }

    .photo-item:hover {
      z-index: 20;

      box-shadow:
        0 35px 65px rgba(73, 53, 40, 0.2),
        0 12px 22px rgba(73, 53, 40, 0.11),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .photo-item:hover img {
      filter: saturate(1) contrast(1.02);
      transform: scale(1.025);
    }

    .wood-clip {
      position: absolute;

      top: -8px;
      left: 50%;

      width: 40px;
      height: 15px;

      transform: translateX(-50%);

      background:
        linear-gradient(
          180deg,
          #d6a477,
          #ae774c
        );

      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.4),
        inset 0 -2px 4px rgba(72, 42, 23, 0.25),
        0 5px 9px rgba(62, 38, 24, 0.13);

      z-index: 8;
    }

    .wood-clip::before {
      content: "";

      position: absolute;

      top: 50%;
      left: 50%;

      width: 5px;
      height: 9px;

      transform: translate(-50%, -50%);

      background: #76716c;
    }

    /*
      ============================================================
      AMBIENT DECOR
      ============================================================
    */

    .cute-element {
      position: absolute;
      pointer-events: none;

      color: rgba(157, 101, 94, 0.32);

      font-family:
        "Cormorant Garamond",
        serif;

      z-index: 1;

      animation: ambientFloat 9s var(--ease-fluid) infinite;
    }

    .cute-element.animal,
    .cute-element.tree {
      filter: grayscale(1);
      opacity: 0.12;
    }

    .cute-element.star,
    .cute-element.heart,
    .cute-element.sparkle,
    .cute-element.leaf {
      opacity: 0.4;
    }

    @keyframes ambientFloat {
      0%,
      100% {
        transform: translate3d(0, 0, 0) rotate(0deg);
      }

      50% {
        transform: translate3d(0, -14px, 0) rotate(4deg);
      }
    }

    /*
      ============================================================
      CONTINUE IMAGE
      ============================================================
    */

    .continue-text {
      position: fixed;

      right: 28px;
      bottom: 28px;

      width: 145px;

      z-index: var(--z-floating);

      pointer-events: none;

      opacity: 0.8;

      animation: continueFloat 5s var(--ease-fluid) infinite;
    }

    .continue-text img {
      display: block;
      width: 100%;
      height: auto;
    }

    @keyframes continueFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    /*
      ============================================================
      STORY MODAL
      ============================================================
    */

    .story-modal {
      position: fixed;
      inset: 0;

      z-index: var(--z-modal);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: rgba(38, 32, 28, 0.48);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 650ms var(--ease-fluid),
        visibility 650ms var(--ease-fluid);
    }

    .story-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-shell {
      width: min(1080px, 100%);
      max-height: min(780px, calc(100dvh - 60px));

      padding: 8px;

      border-radius: 34px;

      background: rgba(255, 255, 255, 0.18);

      box-shadow:
        0 50px 120px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.42);

      transform:
        translateY(42px)
        scale(0.96);

      transition:
        transform 850ms var(--ease-spring);
    }

    .story-modal.active .modal-shell {
      transform:
        translateY(0)
        scale(1);
    }

    .modal-content {
      position: relative;

      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);

      width: 100%;
      max-height: inherit;

      overflow: hidden;

      border-radius: 27px;

      background: var(--paper-light);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .modal-image-wrap {
      min-height: 620px;
      overflow: hidden;
      background: #ded6cc;
    }

    .modal-content img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      transition:
        transform 1200ms var(--ease-fluid);
    }

    .story-modal.active .modal-content img {
      transform: scale(1.015);
    }

    .modal-body {
      min-height: 0;
      overflow-y: auto;

      padding: 70px 58px 55px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .modal-index {
      margin-bottom: 20px;

      color: var(--accent);

      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .modal-date {
      margin-bottom: 22px;

      color: var(--ink-muted);

      font-size: 11px;
      letter-spacing: 0.16em;
    }

    .modal-story {
      color: var(--ink-soft);

      font-family:
        "Noto Serif SC",
        "Songti SC",
        serif;

      font-size: 16px;
      line-height: 2.05;

      white-space: pre-line;
    }

    .modal-story::first-letter {
      color: var(--accent);
      font-size: 2.2em;
      line-height: 0.9;
    }

    .close-btn {
      position: absolute;

      top: 22px;
      right: 22px;

      width: 42px;
      height: 42px;

      z-index: 5;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: rgba(250, 247, 241, 0.72);

      color: var(--ink);

      font-size: 22px;
      line-height: 1;

      cursor: pointer;

      transition:
        transform 600ms var(--ease-spring),
        background 450ms var(--ease-fluid);
    }

    .close-btn:hover {
      transform: rotate(90deg) scale(1.08);
      background: var(--paper-light);
    }

    .close-btn:active {
      transform: rotate(90deg) scale(0.94);
    }

    /*
      ============================================================
      MESSAGE SECTION
      ============================================================
    */

    .message-board {
      position: relative;
      z-index: var(--z-content);

      width: min(1100px, calc(100% - 48px));

      margin: 80px auto 160px;

      padding-top: 100px;

      border-top: 1px solid rgba(94, 72, 56, 0.08);
    }

    .message-header {
      width: min(700px, 100%);
      margin-bottom: 65px;
    }

    .message-header .eyebrow {
      margin-bottom: 20px;
    }

    .message-header h2 {
      color: var(--ink);

      font-family:
        "Cormorant Garamond",
        "Noto Serif SC",
        serif;

      font-size: clamp(44px, 6vw, 80px);
      font-weight: 500;
      line-height: 0.92;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }

    .message-header p {
      max-width: 460px;

      margin-top: 26px;

      color: var(--ink-muted);

      font-size: 13px;
      line-height: 2;
    }

    /*
      DOUBLE BEZEL FORM
    */

    .message-form-shell {
      width: min(760px, 100%);
      margin-left: auto;

      padding: 7px;

      border-radius: 30px;

      background: rgba(84, 62, 47, 0.045);

      box-shadow:
        inset 0 0 0 1px rgba(84, 62, 47, 0.05);
    }

    .message-form {
      padding: 34px;

      border-radius: 24px;

      background: rgba(255, 252, 247, 0.84);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.96);
    }

    .form-label {
      display: block;

      margin-bottom: 8px;

      color: var(--ink-muted);

      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .input-wrap,
    .textarea-wrap {
      margin-bottom: 22px;
    }

    #commentName,
    #commentMessage {
      width: 100%;

      border: 0;
      outline: 0;

      border-radius: 17px;

      background: rgba(239, 232, 223, 0.58);

      color: var(--ink);

      transition:
        background 500ms var(--ease-fluid),
        box-shadow 500ms var(--ease-fluid),
        transform 500ms var(--ease-spring);
    }

    #commentName {
      height: 54px;
      padding: 0 18px;
    }

    #commentMessage {
      min-height: 150px;

      padding: 16px 18px;

      resize: vertical;

      line-height: 1.8;
    }

    #commentName::placeholder,
    #commentMessage::placeholder {
      color: #a69b90;
    }

    #commentName:hover,
    #commentMessage:hover {
      background: rgba(235, 226, 216, 0.74);
    }

    #commentName:focus,
    #commentMessage:focus {
      background: #f8f3eb;

      box-shadow:
        0 0 0 1px rgba(157, 101, 94, 0.2),
        0 14px 32px rgba(86, 61, 45, 0.06);

      transform: translateY(-1px);
    }

    .message-submit {
      position: relative;

      display: inline-flex;
      align-items: center;
      gap: 12px;

      min-height: 52px;

      padding: 7px 8px 7px 22px;

      border-radius: 999px;

      background: var(--ink);
      color: var(--paper-light);

      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;

      cursor: pointer;

      transition:
        transform 600ms var(--ease-spring),
        background 500ms var(--ease-fluid);
    }

    .message-submit:hover {
      transform: translateY(-3px);
      background: var(--accent);
    }

    .message-submit:active {

<body>
  <!-- =========================================================

  <header class="page-title">

      <h1>

        <span>故事</span>

      <p>
        从一次旅行开始，到一次又一次的重逢。

    <!-- =======================================================

         ======================================================= -->

    <section class="message-board">

              class="form-label"
              for="commentMessage"
            >
              Your message
            </label>

            <textarea
              id="commentMessage"
              placeholder="写下你想说的话……"
              maxlength="300"
            ></textarea>
          </div>

          <button

            class="message-submit"
            type="button"
          >

              ↗
            </span>
          </button>

  <!-- =========================================================
       STORY MODAL
       ========================================================= -->

  <div
    class="story-modal"
    id="storyModal"
    aria-hidden="true"
  >

            id="modalIndex"

            Memory
          </div>

  <!-- =========================================================
       TOAST
       ========================================================= -->

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script>
    /*
      ============================================================
      UTILITIES
      ============================================================
    */

    const toast = document.getElementById("toast");

    let toastTimer = null;

    function showToast(message) {
      clearTimeout(toastTimer);

      toast.textContent = message;
      toast.classList.add("show");

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function formatCommentTime(time) {
      const date = new Date(time);

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}.${month}.${day}`;
    }

    /*
      ============================================================
      SUPABASE
      原有地址和 Key 保持不变
      ============================================================
    */

    const SUPABASE_URL =
      "https://oxtmecvezbcmeglqxnwz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_1OZPJc2qmeNW4PBobh5DGg_ebyYAOtK";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    /*
      ============================================================
      COMMENTS
      ============================================================
    */

    async function submitComment() {
      const nameInput =
        document.getElementById("commentName");

      const messageInput =
        document.getElementById("commentMessage");

      const button =
        document.getElementById("submitComment");

      const name = nameInput.value.trim();
      const message = messageInput.value.trim();

      if (!name) {
        showToast("请先留下你的名字。");
        nameInput.focus();
        return;
      }

      if (!message) {
        showToast("还没有写下留言内容。");
        messageInput.focus();
        return;
      }

      button.disabled = true;
      button.style.opacity = "0.6";

      try {
        const { error } =
          await supabaseClient
            .from("comments")
            .insert([
              {
                name: name,
                message: message,
              },
            ]);

        if (error) {
          console.error("留言提交失败：", error);
          showToast("留言没有成功提交，请稍后再试。");
          return;
        }

        nameInput.value = "";
        messageInput.value = "";

        showToast("你的留言已经留下。");

        await loadComments();
      } finally {
        button.disabled = false;
        button.style.opacity = "1";
      }
    }

    document
      .getElementById("submitComment")
      .addEventListener(
        "click",
        submitComment
      );

    async function loadComments() {
      const { data, error } =
        await supabaseClient
          .from("comments")
          .select("*")
          .order("created_at", {
            ascending: false,
          });

      if (error) {
        console.error("读取留言失败：", error);
        return;
      }

      const commentsList =
        document.getElementById("commentsList");

      commentsList.innerHTML = "";

      if (!data || data.length === 0) {
        commentsList.innerHTML = `
          <div class="empty-comments">
            <div class="empty-heart">♡</div>
            <div>还没有留言哦</div>
            <small>成为第一个留下心意的人吧</small>
          </div>
        `;

        return;
      }

      data.forEach((comment, index) => {
        const shell =
          document.createElement("div");

        shell.className =
          "comment-item-shell reveal";

        const item =
          document.createElement("div");

        item.className = "comment-item";

        item.innerHTML = `
          <div class="comment-number">
            ${String(index + 1).padStart(2, "0")}
          </div>

          <div class="comment-name">
            ${escapeHtml(comment.name)}
          </div>

          <div class="comment-message">
            ${escapeHtml(comment.message)}
          </div>

          <button
            class="comment-more"
            type="button"
          >
            查看全文 ↓
          </button>

          <div class="comment-time">
            ${formatCommentTime(comment.created_at)}
          </div>
        `;

        shell.appendChild(item);
        commentsList.appendChild(shell);

        const messageElement =
          item.querySelector(
            ".comment-message"

    const photoWall =

    function drawTwistedRope(canvas) {
      const ctx =
        canvas.getContext("2d");

      const rect =
        canvas.getBoundingClientRect();

      const width =
        Math.floor(rect.width);

      const height = 90;

      if (width <= 10) {
        return null;
      }

      canvas.width = width;
      canvas.height = height;

      ctx.clearRect(
        0,
        0,
        width,
        height
      );

      const startX = 16;
      const endX = width - 16;

      const startY = 17;
      const endY = 17;

      const midY =
        43 + Math.random() * 8;

      ctx.beginPath();

      ctx.moveTo(
        startX,
        startY + 3
      );

      ctx.quadraticCurveTo(
        width / 2,
        midY + 9,
        endX,
        endY + 3
      );

      ctx.strokeStyle =
        "rgba(64, 42, 28, 0.14)";

      ctx.lineWidth = 8;
      ctx.lineCap = "round";

      ctx.filter = "blur(3px)";
      ctx.stroke();

      ctx.filter = "none";

      ctx.beginPath();

      ctx.moveTo(
        startX,
        startY
      );

      ctx.quadraticCurveTo(
        width / 2,
        midY + 3,
        endX,
        endY
      );

      ctx.strokeStyle =
        "rgba(91, 60, 38, 0.18)";

      ctx.lineWidth = 7;
      ctx.lineCap = "round";

      ctx.stroke();

      ctx.beginPath();

      ctx.moveTo(
        startX,
        startY
      );

      ctx.quadraticCurveTo(
        width / 2,
        midY,
        endX,
        endY
      );

      ctx.strokeStyle =
        "#a9784d";

      ctx.lineWidth = 4.5;

      ctx.stroke();

      ctx.beginPath();

      ctx.moveTo(
        startX,
        startY - 1
      );

      ctx.quadraticCurveTo(
        width / 2,
        midY - 1.5,
        endX,
        endY - 1
      );

      ctx.strokeStyle =
        "rgba(255, 255, 255, 0.3)";

      ctx.lineWidth = 1.2;

      ctx.stroke();

      return {
        startX,
        endX,
        startY,
        endY,
        controlY: midY,
      };
    }

    function renderPhotos() {
      ropeSets.forEach(
        (set, ropeIndex) => {
          const canvas =
            set.querySelector(
              ".rope-canvas"
            );

          const curve =
            drawTwistedRope(canvas);

          if (!curve) {
            return;
          }

          const groupPhotos =
            photos.filter(
              (photo) =>
                photo.rope === ropeIndex
            );

          const count =
            groupPhotos.length;

          const setRect =
            set.getBoundingClientRect();

          const setWidth =
            setRect.width;

          const startX = 20;
          const endX =
            setWidth - 20;

          const gap =
            (endX - startX) /
            (count + 1);

          const isMobile =
            window.innerWidth <= 768;

          const baseWidth =
            isMobile ? 72 : 108;

          const sizeRange =
            isMobile ? 18 : 30;

          groupPhotos.forEach(
            (photo, index) => {
              const item =
                document.createElement(
                  "div"
                );

              item.className =
                "photo-item";

              const size =
                baseWidth +
                Math.random() *
                  sizeRange;

              const photoHeight =
                size * 1.3;

              const rotate =
                (Math.random() - 0.5) *
                10;

              const baseX =
                startX +
                gap * (index + 1);

              const offsetX =
                (Math.random() - 0.5) *
                gap *
                0.06;

              const currentX =
                baseX + offsetX;

              const t =
                (currentX -
                  curve.startX) /
                (curve.endX -
                  curve.startX);

              const ropeY =
                (1 - t) *
                  (1 - t) *
                  curve.startY +
                2 *
                  t *
                  (1 - t) *
                  curve.controlY +
                t *
                  t *
                  curve.endY;

              const itemTop =
                ropeY +
                photoHeight / 2 +
                Math.random() * 4;

              item.style.width =
                size + "px";

              item.style.height =
                photoHeight + "px";

              item.style.left =
                currentX + "px";

              item.style.top =
                itemTop + "px";

              const swing =
                (index % 2 === 0
                  ? 1
                  : -1) *
                (3 +
                  Math.random() * 5);

              item.style.setProperty(
                "--rotate",
                rotate + "deg"
              );

              item.style.setProperty(
                "--swing",
                swing + "px"
              );

              item.style.transform =
                `translate(-50%, -50%) rotate(${rotate}deg)`;

              item.style.animation =
                `photoSwing ${
                  5.8 +
                  Math.random() * 1.8
                }s ${
                  Math.random() * 1.8
                }s var(--ease-spring) infinite`;

              item.innerHTML = `
                <div class="wood-clip"></div>
                <img
                  src="${photo.src}"
                  alt="${photo.date} 的故事照片"
                  loading="lazy"
                />
              `;

              item.addEventListener(
                "click",
                () => {
                  openModal(
                    photo,
                    photos.indexOf(photo)
                  );
                }
              );

              set.appendChild(item);

              setTimeout(
                () => {
                  item.classList.add(
                    "show"
                  );
                },
                280 +
                  index * 120 +
                  ropeIndex * 180
              );
            }
          );
        }
      );

      canvas.height =
        window.innerHeight * ratio;

        window.innerWidth + "px";

      canvas.style.height =
        window.innerHeight + "px";

      ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );
    }

    class SnowFlake {
      constructor() {
        this.reset();

        this.y =
          Math.random() *
          window.innerHeight;
      }

      reset() {
        this.x =
          Math.random() *
          window.innerWidth;

        this.y = -20;

        this.size =
          1.5 +
          Math.random() * 4;

        this.speed =
          0.15 +
          Math.random() * 0.55;

        this.opacity =
          0.15 +
          Math.random() * 0.28;

        this.swayOffset =
          Math.random() *
          Math.PI *
          2;

        this.swaySpeed =
          0.003 +
          Math.random() * 0.006;
      }

      update() {
        this.y +=
          this.speed;

        this.x +=
          Math.sin(
            this.y *
              this.swaySpeed +
              this.swayOffset
          ) * 0.45;

        if (
          this.y >
          window.innerHeight + 20
        ) {
          this.reset();
        }
      }

      draw() {
        ctx.save();

        ctx.globalAlpha =
          this.opacity;

        ctx.strokeStyle =
          "#fff";

        ctx.lineWidth = 0.8;

        ctx.translate(
          this.x,
          this.y
        );

        ctx.beginPath();

        ctx.arc(
          0,
          0,
          this.size,
          0,
          Math.PI * 2
        );

        ctx.stroke();

        ctx.restore();
      }
    }

    function stopIconRotate() {
      if (rotateAnimId) {
        cancelAnimationFrame(
          rotateAnimId
        );

        rotateAnimId = null;
      }
    }

    let currentLyricIndex =

    function switchLyric(index) {
      if (
        isLyricSwitching ||
        index ===
          currentLyricIndex
      ) {
        return;
      }

      isLyricSwitching = true;

      currentLyricIndex =
        index;

      const text =

          index

      lyricLine.style.opacity =
        "0";

      setTimeout(() => {
        lyricLine.innerHTML =
          `<span class="lyric-content">${escapeHtml(
            text
          )}</span>`;

        const contentEl =
          lyricLine.querySelector(
            ".lyric-content"
          );

        if (
          contentEl.scrollWidth >
          lyricLine.clientWidth
        ) {
          lyricLine.classList.add(
            "scrolling"
          );
        } else {
          lyricLine.classList.remove(
            "scrolling"
          );
        }

        requestAnimationFrame(
          () => {
            lyricLine.style.opacity =
              "1";
          }
        );

        setTimeout(() => {
          isLyricSwitching =
            false;
        }, 400);
      }, 350);
    }

    bgmAudio.addEventListener(
      "timeupdate",
      () => {
        const currentTime =
          bgmAudio.currentTime;

        let targetIndex = 0;

          i >= 0;
