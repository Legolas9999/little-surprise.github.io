<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- HTML 连接 Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我们的故事</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        cursor: none !important;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 18% 22%,
            rgba(255, 255, 255, 0.7) 0,
            transparent 26%
          ),
          radial-gradient(
            circle at 82% 75%,
            rgba(255, 255, 255, 0.6) 0,
            transparent 22%
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(255, 255, 255, 0.35) 0,
            transparent 35%
          ),
          repeating-radial-gradient(
            circle at center,
            rgba(220, 230, 245, 0.2) 0,
            rgba(220, 230, 245, 0.2) 2px,
            transparent 2px,
            transparent 22px
          ),
          linear-gradient(135deg, #f5f7fa 0%, #eaf0f9 50%, #f3f0fa 100%);
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow-x: hidden;
        color: #5a4a52;
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        background-image:
          radial-gradient(
            circle at 12% 18%,
            rgba(255, 255, 255, 0.85) 0 8%,
            transparent 9%
          ),
          radial-gradient(
            circle at 88% 12%,
            rgba(255, 255, 255, 0.75) 0 10%,
            transparent 11%
          ),
          radial-gradient(
            circle at 15% 85%,
            rgba(255, 255, 255, 0.65) 0 7%,
            transparent 8%
          ),
          radial-gradient(
            circle at 85% 80%,
            rgba(255, 255, 255, 0.7) 0 9%,
            transparent 10%
          ),
          linear-gradient(
            90deg,
            rgba(200, 215, 235, 0.15) 1px,
            transparent 1px
          ),
          linear-gradient(rgba(200, 215, 235, 0.15) 1px, transparent 1px);
        background-size:
          100% 100%,
          100% 100%,
          100% 100%,
          100% 100%,
          50px 50px,
          50px 50px;
        background-position: center center;
        opacity: 0.6;
      }

      .continue-text {
        position: fixed;

        right: 24px;

        bottom: 24px;

        z-index: 10;

        width: 220px;

        pointer-events: none;

        animation: continueFloat 3s ease-in-out infinite;
      }

      .continue-text img {
        width: 100%;

        height: auto;

        display: block;
      }

      #bgCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      #cursor {
        position: fixed;
        width: 20px;
        height: 20px;
        z-index: 9999;
        pointer-events: none;
        transform: translate(-50%, -50%);
        animation: cursorBeat 1.2s ease-in-out infinite;
      }

      #cursor::before,
      #cursor::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 16px;
        background: #f093b8;
        border-radius: 10px 10px 0 0;
        top: 0;
        box-shadow: 0 0 8px rgba(240, 147, 184, 0.5);
      }

      #cursor::before {
        left: 10px;
        transform: rotate(-45deg);
        transform-origin: 0 100%;
      }

      #cursor::after {
        left: 0;
        transform: rotate(45deg);
        transform-origin: 100% 100%;
      }

      @keyframes cursorBeat {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.2);
        }
      }

      @keyframes continueFloat {
        0%,
        100% {
          transform: translateY(0px) rotate(-3deg);
        }

        50% {
          transform: translateY(-8px) rotate(3deg);
        }
      }

      .click-heart {
        position: fixed;
        pointer-events: none;
        z-index: 9998;
        animation: clickHeartFloat 1.5s ease-out forwards;
        color: #f28eb8;
      }

      @keyframes clickHeartFloat {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.5);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -150%) scale(1.2);
        }
      }

      .page-title {
        text-align: center;
        padding: 16px 20px 0;
        position: relative;
        z-index: 1;
      }

      .subtitle {
        margin-top: 18px;

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 15px;

        font-family: "KaiTi", "STKaiti", serif;

        font-size: 20px;

        letter-spacing: 3px;

        color: #ffffff;

        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      }

      .story-title-img {
        width: 420px;
        height: auto;
        display: block;
        margin: 0 auto;
      }

      .page-title h1 {
        font-size: 2.5rem;
        color: #a87a9a;
        font-weight: 500;
        margin-bottom: 6px;
        animation: titleGlow 3s ease-in-out infinite alternate;
      }

      .page-title p {
        color: #8f8aa0;
        font-size: 1.05rem;
        opacity: 0.9;
      }

      @keyframes titleGlow {
        0% {
          text-shadow: 0 0 10px rgba(180, 150, 190, 0.25);
        }
        100% {
          text-shadow: 0 0 20px rgba(180, 150, 190, 0.45);
        }
      }

      .photo-wall {
        position: relative;

        width: 92%;
        max-width: 1200px;

        min-height: 780px;

        margin: 0 auto 0;

        z-index: 1;
      }

      .rope-set {
        position: absolute;
        left: 5%;
        right: 5%;
        z-index: 1;
      }

      .rope-set.top {
        top: 32px;
      }
      .rope-set.middle {
        top: 220px;
      }
      .rope-set.bottom {
        top: 420px;
      }

      .rope-canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 70px;
        pointer-events: none;
        z-index: 2;
      }

      .rope-anchor {
        position: absolute;
        top: 0;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background:
          radial-gradient(
            circle at 42% 38%,
            rgba(255, 255, 255, 0.32),
            transparent 35%
          ),
          radial-gradient(circle at 50% 50%, #e2c19b, #d4a373, #b8895a);
        box-shadow:
          inset 0 2px 3px rgba(255, 255, 255, 0.45),
          inset 0 -3px 6px rgba(70, 40, 20, 0.4),
          0 3px 5px rgba(0, 0, 0, 0.28),
          0 8px 16px rgba(0, 0, 0, 0.22);
        z-index: 4;
      }

      .rope-anchor.left {
        left: -14px;
      }
      .rope-anchor.right {
        right: -14px;
      }

      .rope-anchor::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(70, 45, 25, 0.55),
          rgba(70, 45, 25, 0.35)
        );
        transform: translate(-50%, -50%);
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35);
      }

      .rope-anchor::after {
        content: "";
        position: absolute;
        top: 12px;
        left: 12px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
      }

      .photo-item {
        position: absolute;
        background: #ffffff;
        padding: 7px 7px 16px;
        border-radius: 4px;
        box-shadow:
          0 8px 20px rgba(180, 180, 200, 0.22),
          0 4px 10px rgba(0, 0, 0, 0.08);
        transition: all 0.4s ease;
        opacity: 0;
        animation: photoFloat 6s ease-in-out infinite;
        cursor: pointer;
        z-index: 5;
      }

      .photo-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 2px;
      }

      .photo-item:hover {
        transform: translate(-50%, -50%) scale(1.15) rotate(0deg) !important;
        box-shadow:
          0 15px 35px rgba(190, 180, 210, 0.35),
          0 8px 18px rgba(0, 0, 0, 0.12);
        z-index: 20;
      }

      @keyframes photoFloat {
        0% {
          transform: translate(-50%, -50%) translateX(0) translateY(0)
            rotate(var(--rotate));
        }

        25% {
          transform: translate(-50%, -50%) translateX(var(--swing))
            translateY(-4px) rotate(calc(var(--rotate) + 2deg));
        }

        50% {
          transform: translate(-50%, -50%) translateX(0) translateY(-8px)
            rotate(var(--rotate));
        }

        75% {
          transform: translate(-50%, -50%) translateX(calc(var(--swing) * -1))
            translateY(-4px) rotate(calc(var(--rotate) - 2deg));
        }

        100% {
          transform: translate(-50%, -50%) translateX(0) translateY(0)
            rotate(var(--rotate));
        }
      }

      .photo-item.show {
        opacity: 1;
      }

      .photo-item {
        opacity: 1;
      }

      .wood-clip {
        position: absolute;
        top: -7px;
        left: 50%;
        transform: translateX(-50%);
        width: 42px;
        height: 14px;
        background: linear-gradient(
          180deg,
          #d9a876 0%,
          #c18f5f 50%,
          #a6784a 100%
        );
        border-radius: 2px;
        z-index: 6;
        box-shadow:
          inset 0 1px 2px rgba(255, 255, 255, 0.4),
          inset 0 -2px 4px rgba(70, 45, 20, 0.35),
          0 2px 4px rgba(0, 0, 0, 0.25);
      }

      .wood-clip::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 5px;
        height: 9px;
        background: linear-gradient(180deg, #9a9a9a, #6a6a6a);
        border-radius: 1px;
      }

      .cute-element {
        position: absolute;
        pointer-events: none;
        opacity: 0.75;
        animation: floatElement 8s ease-in-out infinite;
        z-index: 0;
        font-size: 28px;
      }

      .cute-element.star {
        color: #f4d66b;
        font-size: 22px;
      }
      .cute-element.heart {
        color: #f4b6ce;
        font-size: 20px;
      }
      .cute-element.sparkle {
        color: #d8c8f0;
        font-size: 24px;
      }
      .cute-element.cloud {
        color: #ffffff;
        font-size: 26px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
      }
      .cute-element.animal {
        font-size: 42px;
        opacity: 0.85;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.12));
      }
      .cute-element.tree {
        font-size: 38px;
        opacity: 0.8;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.12));
      }
      .cute-element.leaf {
        color: #89b96a;
        font-size: 20px;
        opacity: 0.7;
      }

      @keyframes floatElement {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-12px) rotate(8deg);
        }
      }

      .story-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(240, 240, 250, 0.7);
        backdrop-filter: blur(8px);
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        padding: 20px;
      }

      .story-modal.active {
        opacity: 1;
        visibility: visible;
      }

      .modal-content {
        background: #fafbff;
        border-radius: 16px;
        max-width: 700px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        transform: scale(0.8);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        color: #5a4a52;
        box-shadow: 0 15px 40px rgba(160, 160, 190, 0.2);
      }

      .story-modal.active .modal-content {
        transform: scale(1);
      }

      .modal-content img {
        width: 100%;
        height: auto;
        border-radius: 16px 16px 0 0;
      }

      .modal-body {
        padding: 25px 30px 30px;
      }

      .modal-date {
        color: #a07ba8;
        font-size: 0.95rem;
        margin-bottom: 10px;
        font-weight: 500;
      }

      .modal-story {
        font-size: 1.05rem;
        line-height: 1.8;
        color: #6b5a62;
        text-align: left;
        white-space: pre-line;
      }

      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        border: none;
        color: #a87a9a;
        font-size: 20px;
        line-height: 36px;
        text-align: center;
        transition: background 0.3s;
        cursor: pointer;
      }

      .close-btn:hover {
        background: rgba(255, 255, 255, 0.9);
      }

      /* ========== 背景音乐控件 ========== */
      .music-player {
        position: fixed;
        top: 20px;
        right: 24px;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(8px);
        padding: 8px 15px;
        border-radius: 30px;
        box-shadow: 0 4px 12px rgba(180, 160, 200, 0.15);
      }

      .music-icon {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        cursor: pointer;
        color: #a87a9a;
        flex-shrink: 0;
      }

      .music-info {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        max-width: 200px;
      }

      .song-name {
        font-size: 0.9rem;
        color: #7a5a82;
        font-weight: 500;
        white-space: nowrap;
      }

      .lyric-line {
        font-size: 0.8rem;
        color: #9a8aa2;
        white-space: nowrap;
        overflow: hidden;
        width: 180px;
        text-align: right;
        position: relative;
        opacity: 1;
        transition: opacity 0.4s ease-in-out;
      }

      .lyric-line .lyric-content {
        display: inline-block;
      }

      .lyric-line.scrolling .lyric-content {
        animation: lyricScroll 8s linear forwards;
      }

      @keyframes lyricScroll {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }

      /* 移动端适配 */
      @media (max-width: 768px) {
        * {
          cursor: auto !important;
        }
        #cursor {
          display: none;
        }

        .page-title {
          padding: 14px 20px 0;
        }
        .page-title h1 {
          font-size: 1.8rem;
        }

        .photo-wall {
          min-height: 620px;
        }
        /* 先+20 */
        .rope-set.top {
          top: 50px;
        }
        .rope-set.middle {
          top: 205px;
        }
        .rope-set.bottom {
          top: 360px;
        }

        .photo-item {
          padding: 5px 5px 12px;
        }
        .wood-clip {
          width: 36px;
          height: 12px;
          top: -6px;
        }
        .wood-clip::before {
          width: 4px;
          height: 8px;
        }

        .cute-element.animal {
          font-size: 32px;
        }
        .cute-element.tree {
          font-size: 30px;
        }

        .continue-text {
          right: 16px;

          bottom: 16px;

          width: 140px;
        }

        .story-title-img {
          width: 260px;
        }

        @media (max-width: 768px) {
          .music-player {
            position: absolute;

            top: 120px;

            right: 50%;

            transform: translateX(50%);

            padding: 4px 15px;

            border-radius: 20px;
          }
        }

        .music-icon {
          width: 26px;

          height: 26px;

          font-size: 16px;
        }

        .music-info {
          max-width: 90px;
          transform: translateX(5px);
        }

        .song-name {
          font-size: 0.65rem;
        }

        .lyric-line {
          width: 90px;

          font-size: 0.55rem;
        }

        /* =========================
   留言板 - 手机端
========================= */

        .message-board {
          width: 90%;

          margin: 80px auto 90px;

          position: relative;

          clear: both;
        }

        .message-header h2 {
          font-size: 22px;

          letter-spacing: 2px;

          padding: 6px 12px;
        }

        .message-header p {
          font-size: 12px;

          line-height: 1.8;
        }

        .message-header::before,
        .message-header::after {
          width: 15%;
        }

        .message-form {
          padding: 20px 16px;

          border-radius: 20px;
        }

        #commentName {
          height: 44px;

          font-size: 14px;
        }

        #commentMessage {
          min-height: 115px;

          font-size: 14px;
        }

        .message-submit {
          width: 80%;

          min-width: 0;

          padding: 11px 16px;

          font-size: 14px;
        }

        .comments-title {
          margin-top: 40px;

          font-size: 18px;

          gap: 9px;
        }

        #commentsList {
          grid-template-columns: 1fr;

          gap: 18px;
        }

        .comment-item {
          padding: 22px 20px 18px;
        }

        .comment-name {
          font-size: 16px;
        }

        .comment-message {
          font-size: 13px;

          line-height: 1.85;
        }

        .comment-time {
          font-size: 10px;
        }
      }

      /* =========================
   密码保护层
========================= */

      #passwordOverlay {
        position: fixed;

        inset: 0;

        z-index: 99999;

        display: flex;

        justify-content: center;

        align-items: center;

        background: rgba(255, 255, 255, 0.35);

        backdrop-filter: blur(15px);

        -webkit-backdrop-filter: blur(15px);
      }

      /* 密码卡片 */

      .password-box {
        width: 300px;

        padding: 30px 25px;

        background: rgba(255, 255, 255, 0.85);

        border-radius: 30px;

        text-align: center;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      .lock-icon {
        font-size: 45px;
      }

      .password-box h2 {
        margin: 15px 0 8px;

        color: #c57b95;

        font-size: 22px;
      }

      .password-box p {
        color: #999;

        font-size: 14px;
      }

      #passwordInput {
        width: 100%;

        padding: 12px;

        margin-top: 20px;

        border-radius: 20px;

        border: 2px solid #f2c7d5;

        outline: none;

        text-align: center;

        font-size: 16px;
      }

      #unlockBtn {
        margin-top: 15px;

        width: 100%;

        padding: 12px;

        border: none;

        border-radius: 20px;

        background: #f3a8c0;

        color: white;

        font-size: 16px;
      }

      #errorMsg {
        display: none;

        margin-top: 12px;

        color: #ff8aa8;

        font-size: 13px;
      }

      #passwordOverlay {
        transition: opacity 2s;
      }

      /* ========================================
   💌 留言板
======================================== */

      .message-board {
        width: min(900px, 88%);

        position: relative;

        margin: 120px auto 140px;

        z-index: 2;

        text-align: center;

        clear: both;
      }

      /* ---------- 标题 ---------- */

      .message-header {
        position: relative;
        margin-bottom: 32px;
      }

      .message-header::before,
      .message-header::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 25%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(196, 150, 170, 0.5)
        );
      }

      .message-header::before {
        left: 0;
      }

      .message-header::after {
        right: 0;
        transform: rotate(180deg);
      }

      .message-deco {
        color: #e8a8c0;
        font-size: 20px;
        margin-bottom: 8px;
        animation: messageSparkle 2s ease-in-out infinite;
      }

      .message-header h2 {
        display: inline-block;
        margin: 0;
        padding: 8px 24px;

        color: #a67891;

        font-family: "KaiTi", "STKaiti", "PingFang SC", serif;

        font-size: 28px;
        font-weight: 500;
        letter-spacing: 3px;

        text-shadow: 0 2px 8px rgba(180, 140, 160, 0.15);
      }

      .message-header p {
        margin-top: 10px;

        color: #9a8b94;

        font-size: 14px;
        line-height: 1.9;
        letter-spacing: 1px;
      }

      /* ---------- 输入区域 ---------- */

      .message-form {
        width: min(600px, 100%);
        margin: 0 auto;

        padding: 30px;

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.82),
          rgba(255, 248, 252, 0.72)
        );

        border: 1px solid rgba(255, 255, 255, 0.9);

        border-radius: 24px;

        box-shadow:
          0 12px 30px rgba(170, 145, 170, 0.13),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);

        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      /* ---------- 输入框 ---------- */

      .input-wrap,
      .textarea-wrap {
        position: relative;
      }

      .input-wrap {
        margin-bottom: 14px;
      }

      .input-icon,
      .textarea-icon {
        position: absolute;

        left: 16px;
        top: 50%;

        transform: translateY(-50%);

        color: #e0a4bb;

        font-size: 18px;

        pointer-events: none;
      }

      .textarea-icon {
        top: 18px;
        transform: none;
      }

      #commentName,
      #commentMessage {
        width: 100%;

        border: 1.5px solid rgba(224, 175, 194, 0.55);

        background: rgba(255, 255, 255, 0.65);

        color: #665660;

        outline: none;

      function drawTwistedRope(canvas) {
        const ctx = canvas.getContext("2d");
        const rect = canvas.getBoundingClientRect();
        const width = Math.floor(rect.width);
        const height = 70;

        // 保护：宽度为0直接返回，不绘制
        if (width <= 10) return null;

        canvas.width = width;
        canvas.height = height;
        ctx.clearRect(0, 0, width, height);

        const startX = 16;
        const endX = width - 16;
        const startY = 16;
        const endY = 16;

        const midY = 38 + Math.random() * 10;
        const shadowOffsetY = 3;

        ctx.beginPath();
        ctx.moveTo(startX, startY + shadowOffsetY);
        ctx.quadraticCurveTo(
          width / 2,
          midY + shadowOffsetY + 8,
          endX,
          endY + shadowOffsetY,
        );
        ctx.strokeStyle = "rgba(60, 35, 15, 0.2)";
        ctx.lineWidth = 7;
        ctx.lineCap = "round";
        ctx.filter = "blur(2px)";
        ctx.stroke();
        ctx.filter = "none";

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(width / 2, midY + 4, endX, endY);
        ctx.strokeStyle = "rgba(90, 60, 30, 0.15)";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(width / 2, midY, endX, endY);
        ctx.strokeStyle = "#c98f5a";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(startX, startY - 1);
        ctx.quadraticCurveTo(width / 2, midY - 1.5, endX, endY - 1);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        for (let i = 0; i < 12; i++) {
          const t = i / 11;
          const x = startX + (endX - startX) * t;
          const y =
            (1 - t) * (1 - t) * startY + 2 * t * (1 - t) * midY + t * t * endY;

          ctx.fillStyle = "rgba(180, 130, 90, 0.45)";
          ctx.beginPath();
          ctx.arc(x, y, 1.8, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "rgba(130, 90, 60, 0.35)";
          ctx.beginPath();
          ctx.arc(x + 2, y + 2, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }

        return { startX, endX, startY, endY, controlY: midY };
      }

      class SnowFlake {
        constructor() {
          this.reset();
          this.y = Math.random() * canvas.height;
        }

        reset() {
          this.x = Math.random() * canvas.width;
          this.y = -20;
          this.size = 2 + Math.random() * 8;
          this.speed = 0.3 + Math.random() * 1;
          this.opacity = 0.4 + Math.random() * 0.5;
          this.swayOffset = Math.random() * Math.PI * 2;
          this.swaySpeed = 0.005 + Math.random() * 0.01;
        }

        update() {
          this.y += this.speed;
          this.x += Math.sin(this.y * this.swaySpeed + this.swayOffset) * 0.8;

          if (this.y > canvas.height + 20) {
            this.reset();
          }
        }

        draw() {
          ctx.save();

          ctx.globalAlpha = this.opacity;
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.2;

          ctx.translate(this.x, this.y);

          // 雪花六角旋转
          for (let i = 0; i < 6; i++) {
            ctx.rotate(Math.PI / 3);

            ctx.beginPath();

            ctx.moveTo(0, 0);
            ctx.lineTo(0, -this.size * 2);

            // 雪花枝杈
            ctx.moveTo(0, -this.size * 1.2);
            ctx.lineTo(-this.size * 0.5, -this.size * 1.7);

            ctx.moveTo(0, -this.size * 1.2);
            ctx.lineTo(this.size * 0.5, -this.size * 1.7);

            ctx.stroke();
          }

          ctx.restore();
        }
      }
